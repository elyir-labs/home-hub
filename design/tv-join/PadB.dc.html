<!doctype html>
<html>
<head><meta charset="utf-8"><title>B: a keypad the arrows move on</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="tv.css">
<link rel="stylesheet" href="join.css">
</head>
<body>
<div class="screen">
  <div class="join">
    <span class="mark"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></span>
    <h1>This TV is for Maple&nbsp;Court.</h1>
    <p class="lede">Choose the house passcode with the arrows and OK, or press the numbers on your remote.</p>
    <div class="code" id="code"><i class="now"></i><i></i><i></i><i></i></div>
    <p class="error" id="err"></p>
    <div class="actions"><span class="btn" data-f data-hint="OK|Ask the phones in the house">Ask a phone instead</span></div>
  </div>
  <div class="pad" id="pad"></div>
  <div class="foot"><div class="keys" id="hint"></div><span class="where">Living room TV</span></div>
</div>
<script>
  // The pad is twelve cards: the digits, a key that takes one off, and Join once four are in.
  const pad = document.getElementById('pad'), boxes = [...document.querySelectorAll('#code i')]
  for (const k of ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'Join']) {
    const e = document.createElement('span')
    e.className = 'k card' + (k === '⌫' ? ' small' : k === 'Join' ? ' ok' : '')
    e.textContent = k; e.dataset.f = ''; e.dataset.k = k
    e.dataset.hint = k === '⌫' ? 'OK|Take one off' : k === 'Join' ? 'OK|Join the house' : `OK|Type ${k};0–9|Type straight in`
    if (k === '1') e.dataset.fStart = ''
    pad.append(e)
  }
  let typed = ''
  function draw() {
    boxes.forEach((b, i) => { b.className = i < typed.length ? 'on' : i === typed.length ? 'now' : '' })
    pad.querySelector('[data-k="Join"]').style.opacity = typed.length >= 4 ? 1 : .45
  }
  function press(k) {
    if (/^[0-9]$/.test(k)) { if (typed.length < 4) typed += k }
    else if (k === '⌫') typed = typed.slice(0, -1)
    else if (k === 'Join' && typed.length >= 4) document.getElementById('err').textContent = 'Joining…'
    draw()
  }
  pad.addEventListener('click', (ev) => { const e = ev.target.closest('[data-k]'); if (e) press(e.dataset.k) })
  window.tvKeys = (key, cur, light) => {
    if (/^[0-9]$/.test(key)) { press(key); if (typed.length === 4) light(pad.querySelector('[data-k="Join"]')); return true }
    if ((key === 'Escape' || key === 'Backspace') && typed) { press('⌫'); return true }
    return false
  }
</script>
<script src="tv.js"></script>
</body>
</html>
