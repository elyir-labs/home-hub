<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      /* the panel's own tokens, from app/src/panel.css */
      --ink: #f1eee8;
      --ink-2: #b9b5ad;
      --ink-3: #7f7d77;
      --lamp: #e9b872;
      --live: #74c69d;
      --warn: #e08a8a;
      --muted: oklch(0.594 0.01 269);
      --surface: rgba(26,28,34,.68);
      --surface-hi: rgba(255,255,255,.08);
      --edge: rgba(255,255,255,.1);
      --edge-hi: rgba(255,255,255,.18);
      --lamp-ink: #2a1c07;
      --glass: linear-gradient(148deg, oklch(0.397 .014 281 / .34), oklch(0.327 .012 281 / .12) 46%, oklch(0.357 .014 281 / .24));
      --rim: linear-gradient(158deg, rgba(255,255,255,0.69), rgba(255,255,255,.08) 34%, rgba(14,14,22,0.04) 62%, rgba(255,255,255,0.40));
      --inner: inset 0 -46px 56px -48px rgba(20,23,31,0.9);
      --drop: 0 27px 61px -26px rgba(15,17,26,0.67), 0 2px 10px rgba(15,17,26,0.32);
      --sweep: .12;
    }
    .gl {
      position: relative;
      background: var(--glass);
      backdrop-filter: blur(26px) saturate(1.6) brightness(1.04);
      -webkit-backdrop-filter: blur(26px) saturate(1.6) brightness(1.04);
      box-shadow: var(--inner), var(--drop);
    }
    .gl::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      padding: 1.2px; background: var(--rim);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }
    .gl::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(112deg, transparent 26%, rgba(255,255,255,var(--sweep)) 45%, rgba(255,255,255,.02) 56%, transparent 64%);
    }
    .gl > * { position: relative; z-index: 1; }
    .dsp { font-family: inherit; font-weight: 400; letter-spacing: -.025em; }
    .cap { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
    .ic { flex: 0 0 auto; }
    /* a nudge, as the panel draws it on a phone: 358x57, radius 18 */
    .nudge { position: absolute; left: 16px; width: 358px; height: 57px; border-radius: 18px;
             display: grid; grid-template-columns: 32px 1fr; align-items: center; gap: 12px; padding: 0 16px 0 9px;
             background: var(--surface); border: 1px solid rgba(233,184,114,.28); }
    .nudge-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--lamp); color: var(--lamp-ink); }
    .nudge-t { display: block; font-size: 15px; font-weight: 500; line-height: 21px; }
    .nudge-s { display: block; font-size: 13px; color: var(--ink-2); line-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); display: inline-block; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.88); border: 2px solid rgba(12,13,16,.6); }
    .tile { position: absolute; left: 16px; width: 358px; border-radius: 28px; overflow: hidden; background: var(--surface); border: 1px solid var(--edge); }
    .chip { display: inline-grid; place-items: center; height: 25px; padding: 0 11px; border-radius: 999px; background: rgba(12,13,16,.55);
            font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
    .row { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 14px; }
    .row-ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-hi); color: var(--ink-2); }
    .row-t { display: block; font-size: 16px; line-height: 22px; }
    .row-s { display: block; font-size: 13px; line-height: 18px; color: var(--muted); }
      /* the Houses app's own page (app/houses/), read off it at 390x844 with no houses */
    .hs-field { position: absolute; inset: 0; background: linear-gradient(rgb(23,26,42) 0%, rgb(19,21,31) 55%, rgb(15,16,22) 100%); }
    .hs { position: absolute; left: 20px; top: 40px; width: 350px; }
    .hs-title { margin: 0; font-size: 36px; line-height: 39px; letter-spacing: -.9px; font-weight: 400; }
    .hs-lede { margin: 12px 0 0; font-size: 17px; line-height: 24px; color: var(--ink-2); }
    .hs-code { display: flex; gap: 6px; margin-top: 22px; }
    .hs-code i { width: 36px; height: 48px; border-radius: 12px; background: rgba(26,28,34,.68); border: 1px solid rgba(255,255,255,.18); display: block; }
    .hs-code i.gap { width: 8px; background: none; border: 0; }
    .hs-small { margin: 10px 0 0; font-size: 13.5px; line-height: 19px; color: var(--ink-3); }
    .hs-cap { margin: 31px 0 0; font-size: 12px; letter-spacing: .72px; text-transform: uppercase; color: var(--ink-3); }
    .hs-input { margin-top: 8px; height: 54px; border-radius: 16px; background: rgba(26,28,34,.68); border: 1px solid rgba(255,255,255,.18); display: flex; align-items: center; padding: 0 17px; color: rgba(241,238,232,.42); }
    .hs-btn { position: absolute; left: 20px; width: 350px; height: 52px; border-radius: 999px; display: grid; place-items: center; font-size: 17px; font-weight: 500; }
    .hs-btn.solid { background: var(--ink); color: #0c0d10; }
    .hs-btn.off { background: rgba(241,238,232,.5); color: #0c0d10; }
    .hs-btn.ghost { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: var(--ink); }
    .hs-link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(241,238,232,.4); }
  </style>
</helmet>

<!-- A -- A LINE UNDER. Add a house as it is; under it, the site's own words for the way in: Or try a pretend house. -->
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: var(--ink); font-size: 17px; line-height: 1.4;">
  <div class="hs-field"></div>
  <div class="hs">
    <h1 class="hs-title">Add a house</h1>
    <p class="hs-lede">Type the code the house showed you.</p>
    <div class="hs-code"><i></i><i></i><i></i><i></i><i class="gap"></i><i></i><i></i><i></i><i></i></div>
    <p class="hs-small">No code? On the house&rsquo;s screen, open This house, then Add this phone to Houses.</p>
    <p class="hs-cap">Which house</p>
    <div class="hs-input">yourhouse.elyir.app</div>
  </div>
  <p style="position: absolute; left: 20px; top: 716px; width: 350px; margin: 0; text-align: center; font-size: 15px; color: var(--ink-2);">No house yet? <span class="hs-link">Try a pretend house</span></p>
  <div class="hs-btn off" style="top: 768px;">Add it</div>
</div>
</x-dc>
</body>
</html>
