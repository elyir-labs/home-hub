<!doctype html>
<html>
<head><meta charset="utf-8"><title>Glance A</title>

<link rel="stylesheet" href="rest.css">
</head>
<body>
<div class="wall">
  <div class="sky"></div><div class="glow"></div>

  <div class="cloud" style="left:860px; top:250px; width:460px; height:70px; opacity:.7;"></div>
  <svg class="hills" viewBox="0 0 1440 300" preserveAspectRatio="none">
    <path d="M0 150 C 240 110 420 170 700 140 S 1180 100 1440 135 V300 H0z" fill="#3a3140"/>
    <path d="M0 205 C 300 170 520 225 820 195 S 1250 180 1440 200 V300 H0z" fill="#241f2a"/>

  </svg>
  <div class="veil"></div>
  <div style="position:absolute; left:64px; top:64px;">
    <div class="time" style="font-size:168px;">7:41</div>
    <div class="day" style="margin-top:14px;">Monday, September 28</div>
  </div>
  <div style="position:absolute; right:64px; top:78px; display:flex; flex-direction:column; align-items:flex-end; text-shadow:0 1px 12px rgba(0,0,0,.4);">

    <div style="font-size:44px; font-weight:300; letter-spacing:-.02em; margin-top:6px;">16°</div>
    <div class="day" style="font-size:18px;">Partly cloudy · 9° tonight</div>
  </div>
  <div style="position:absolute; left:64px; right:64px; bottom:64px; display:grid; grid-template-columns:repeat(4, 1fr); gap:20px;">
    <div class="glance" style="padding:26px 26px 24px; display:flex; flex-direction:column; justify-content:space-between; height:172px;">
      <span class="gi"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2L12 4.5l8 6.7"/><path d="M6.2 12.6V19h11.6v-6.4"/></svg></span>
      <div><div class="gn">Home</div><div class="gs" style="margin-top:4px;">All calm · doors locked</div></div>
    </div>
    <div class="glance" style="padding:26px 26px 24px; display:flex; flex-direction:column; justify-content:space-between; height:172px;">
      <span class="gi lamp"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9.5" r="5"/><path d="M9.5 16h5M10.5 19h3"/></svg></span>
      <div><div class="gn">Lights</div><div class="gs lamp" style="margin-top:4px;">3 on · Living room, Kitchen</div></div>
    </div>
    <div class="glance" style="padding:26px 26px 24px; display:flex; flex-direction:column; justify-content:space-between; height:172px;">
      <span class="gi"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4.5a2 2 0 0 1 4 0v9.3a4 4 0 1 1-4 0z"/><path d="M12 11v5"/></svg></span>
      <div><div class="gn">Climate</div><div class="gs" style="margin-top:4px;">Living room 21°</div></div>
    </div>
    <div class="glance" style="padding:26px 26px 24px; display:flex; flex-direction:column; justify-content:space-between; height:172px;">
      <span class="gi"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></span>
      <div><div class="gn">Music</div><div class="gs" style="margin-top:4px;">Evening Jazz · Kitchen</div></div>
    </div>
  </div>
</div>

</html>
