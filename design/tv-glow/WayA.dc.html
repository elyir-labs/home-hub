<!doctype html><html><head><meta charset="utf-8"><title>A, then: which way the strip runs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap"><link rel="stylesheet" href="tv.css"><link rel="stylesheet" href="glow.css"></head>
<body><div class="screen">
  <div class="ask"><h1>Where did the light start?</h1><p>The strip behind the TV is lighting up from its first light. Choose the corner it started from, then the way it went.</p></div>
  <div class="opts" style="bottom:330px">
    <span class="card opt" data-f data-f-start data-hint="OK|It started bottom left">Bottom left</span><span class="card opt" data-f data-hint="OK|It started top left">Top left</span>
    <span class="card opt" data-f data-hint="OK|It started top right">Top right</span><span class="card opt" data-f data-hint="OK|It started bottom right">Bottom right</span>
  </div>
  <div class="opts"><span class="card opt" data-f data-hint="OK|Up first">Up first</span><span class="card opt" data-f data-hint="OK|Across first">Across first</span></div>
  <div class="foot"><div class="keys" id="hint"></div><span class="where">The strip shows a moving light from its start while this is up</span></div>
</div><script src="tv.js"></script></body></html>
