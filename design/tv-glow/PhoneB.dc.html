<!doctype html><html><head><meta charset="utf-8"><title>B: mark the screen on a phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap"><link rel="stylesheet" href="tv.css"><link rel="stylesheet" href="glow.css"></head>
<body><div style="position:relative;width:390px;height:844px">
  <div class="phone" style="left:0;top:0">
    <div class="pt"><h2>Where is the TV?</h2><p>Drag the four dots to the corners of the TV's picture, as the camera sees it.</p></div>
    <div class="cam" style="left:16px;top:230px;width:338px;height:420px;border-radius:18px">
      <div class="tv" style="left:50px;top:120px;width:240px;height:140px"></div>
      <span class="mark" style="left:56px;top:126px;width:30px;height:30px;margin:-15px 0 0 -15px"></span><span class="mark" style="left:284px;top:126px;width:30px;height:30px;margin:-15px 0 0 -15px"></span>
      <span class="mark" style="left:284px;top:254px;width:30px;height:30px;margin:-15px 0 0 -15px"></span><span class="mark" style="left:56px;top:254px;width:30px;height:30px;margin:-15px 0 0 -15px"></span>
      <div class="edge" style="left:56px;top:126px;width:228px;height:128px"></div>
    </div>
    <span class="btn">That's the TV</span>
  </div>
</div></body></html>
