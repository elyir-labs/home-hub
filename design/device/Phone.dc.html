<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Instrument Sans", -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      /* app/src/panel.css :root, unchanged */
      --ink: #f1eee8; --ink-2: #b9b5ad; --muted: #7f7d77;
      --lamp: #e9b872; --lamp-deep: #b8863e; --lamp-ink: #2a1c07;
      --live: #74c69d; --danger: #e08a8a; --cool: #7ab0e8;
      --edge: rgba(255,255,255,.10); --edge-hi: rgba(255,255,255,.18);
      --surface-hi: rgba(255,255,255,.08);
    }
    a { color: #e9b872; } a:hover { color: #b8863e; }
    .dsp { /* the titles, in the face the board is already in -- see app/src/panel.css */
           font-family: inherit; font-weight: 400; letter-spacing: -.025em; }
    /* the five zones, at the sizes the pane already uses */
    .room { font-size: 15px; color: var(--ink-2); }
    .name { margin: 4px 0 0; font-size: 56px; line-height: 1.04; }
    .read { font-size: 76px; line-height: 1; letter-spacing: -.02em; }
    .why { font-size: 15.5px; color: var(--ink-2); }
    .fact-v { font-size: 20px; font-weight: 500; }
    .fact-k { margin-top: 2px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    /* a verb: the round control the pane already draws, at its own 56px */
    .ctl { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-hi); border: 1px solid var(--edge); color: var(--ink-2); }
    .ctl.on { background: var(--lamp); border-color: transparent; color: var(--lamp-ink); }
    .ctl.wide { width: auto; height: 56px; border-radius: 999px; padding: 0 24px; display: inline-flex; align-items: center; gap: 11px; font-size: 16.5px; color: var(--ink); }
    .ctl.wide.on { color: var(--lamp-ink); font-weight: 500; }
    .pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13.5px; color: var(--ink-2); background: var(--surface-hi); }
    .lbl { font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .ic { flex: 0 0 auto; }
    /* the day strip every pane carries along its foot */
    .day-line { position: absolute; left: 48px; right: 48px; height: 1px; background: var(--edge); }
    .ev-t { font-size: 13px; color: var(--muted); }
    .ev { font-size: 15px; color: var(--ink-2); margin-top: 3px; }
  </style>
</helmet>

<!-- PHONE -- the light at 390x844. The pane keeps its own measured rules (top 16vh, 30/24 padding, 34px name, 44px reading); the instrument turns on its side. -->
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0c0d10; color: var(--ink); font-size: 17px; line-height: 1.4;">
<div style="position: absolute; inset: 0; background: linear-gradient(rgb(20,23,38), rgb(35,36,58) 44%, rgb(78,55,52) 88%);"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(90% 60% at 60% 80%, rgba(233,184,114,.3), transparent 66%);"></div>
  <div style="position: absolute; left: 24px; top: 42px; right: 24px; filter: blur(9px) brightness(.5);">
    <div class="dsp" style="font-size: 34px;">Living room</div>
    <div style="margin-top: 8px; font-size: 14px; color: #b9b5ad;">Movie &middot; by a routine</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 135px; bottom: 0; border-radius: 28px 28px 0 0; border: 1px solid rgba(255,255,255,.18); border-bottom: 0; overflow: hidden; background: linear-gradient(rgba(26,28,34,.82), rgba(16,17,21,.95));">
    <div style="position: absolute; inset: 0; background: radial-gradient(80% 50% at 70% 96%, rgba(233,184,114,.2), transparent 66%);"></div>
    <div style="position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#b9b5ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>

    <div style="position: absolute; left: 24px; right: 24px; top: 30px;">
      <div class="room" style="font-size: 14px;">Living room</div>
      <div class="dsp" style="font-size: 34px; line-height: 1.06; margin-top: 3px;">Ceiling light</div>
      <div style="display: flex; gap: 11px; margin-top: 20px;">
        <div class="ctl on"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2a1c07" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v8.5M6.6 6.6a7.6 7.6 0 1 0 10.8 0"/></svg></div>
        <div class="ctl"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2L5 10.5l5.2-1.8zM5 17.5l.7 1.8 1.8.7-1.8.7L5 22.5l-.7-1.8-1.8-.7 1.8-.7z"/></svg></div>
        <div class="ctl"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3zM13.5 8.5l2 2"/></svg></div>
      </div>
      <div class="dsp" style="font-size: 44px; line-height: 1; margin-top: 28px;">35%</div>
      <div style="margin-top: 12px; font-size: 14.5px; color: var(--ink-2);">On since 6:12, dimmed by hand at 7:02.</div>

      <!-- the instrument, on its side: the same two properties, the same three levels -->
      <div style="margin-top: 26px; position: relative; height: 76px; border-radius: 38px; background: rgba(255,255,255,.07); border: 1px solid var(--edge); overflow: hidden;">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 35%; background: linear-gradient(90deg, rgba(184,134,62,.85), rgba(243,203,143,.95));"></div>
        <div style="position: absolute; left: 35%; top: 22px; bottom: 22px; width: 3px; margin-left: -14px; border-radius: 2px; background: rgba(255,255,255,.6);"></div>
        <div style="position: absolute; right: 22px; top: 0; bottom: 0; display: flex; align-items: center;"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.32)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></div>
      </div>
      <div style="margin-top: 12px; position: relative; height: 52px; border-radius: 26px; border: 1px solid var(--edge); background: linear-gradient(90deg, #dae7ff, #f6ecdc 42%, #f2c887 72%, #e79a4a); overflow: visible;">
        <div style="position: absolute; top: -6px; bottom: -6px; left: 70%; width: 44px; margin-left: -22px; border-radius: 14px; border: 2.5px solid rgba(255,255,255,.94); box-shadow: 0 6px 16px rgba(0,0,0,.35);"></div>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 18px;">
        <div style="flex: 1 1 0; height: 72px; border-radius: 20px; border: 1px solid var(--edge); background: rgba(255,255,255,.05); display: grid; place-items: center; font-size: 15px; color: var(--ink-2);">Reading</div>
        <div style="flex: 1 1 0; height: 72px; border-radius: 20px; border: 1px solid rgba(233,184,114,.55); background: rgba(233,184,114,.14); display: grid; place-items: center; font-size: 15px;">Evening</div>
        <div style="flex: 1 1 0; height: 72px; border-radius: 20px; border: 1px solid var(--edge); background: rgba(255,255,255,.05); display: grid; place-items: center; font-size: 15px; color: var(--ink-2);">Night</div>
      </div>

      <div style="margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--edge); display: flex; gap: 26px;">
        <div><div class="fact-v" style="font-size: 18px;">2700K</div><div class="fact-k" style="font-size: 11.5px;">Warmth</div></div>
        <div><div class="fact-v" style="font-size: 18px;">Philips Hue</div><div class="fact-k" style="font-size: 11.5px;">Made by</div></div>
      </div>
      <div style="margin-top: 20px; font-size: 13.5px; color: var(--muted); line-height: 1.5;">Today &middot; on at 6:12 by Evening lights, dimmed to 35% at 7:02.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
