<!doctype html>
<html>
<head><meta charset="utf-8"><title>G: tonight's film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="rest-tv.css">
<style>
  .still { position: absolute; inset: 0; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,9,13,.96) 0%, rgba(8,9,13,.86) 34%, rgba(8,9,13,.2) 70%, rgba(8,9,13,.1)),
          linear-gradient(0deg, rgba(8,9,13,.7), transparent 30%); }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; width: 520px; }
  .bar i { display: block; height: 100%; width: 35%; background: var(--ink); }
  .play { display: inline-flex; align-items: center; gap: 16px; height: 76px; padding: 0 36px 0 28px; border-radius: 999px; background: var(--ink); color: #111;
          font-size: 30px; font-weight: 500; box-shadow: 0 0 0 3px rgba(var(--lamp-rgb), .95), 0 0 0 9px rgba(var(--lamp-rgb), .18); }
  .tag { font-size: 22px; color: var(--ink-3); border: 1px solid rgba(255,255,255,.22); border-radius: 8px; padding: 4px 10px; }
</style>
</head>
<body>
<div class="screen">
  <!-- a stand-in for a still from the household's own film library: a harbor at night -->
  <svg class="still" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="hs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1a2e"/><stop offset=".55" stop-color="#23415c"/><stop offset=".56" stop-color="#132538"/><stop offset="1" stop-color="#08111c"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/></filter></defs>
    <rect width="1920" height="1080" fill="url(#hs)"/>
    <g filter="url(#b)">
      <path d="M900 594 L960 520 L1180 520 L1240 594z" fill="#0a1422"/>
      <rect x="1000" y="380" width="10" height="140" fill="#0a1422"/>
      <path d="M1300 594 V430 H1340 V400 H1400 V594z" fill="#0b1626"/>
      <rect x="1500" y="470" width="420" height="124" fill="#0b1626"/>
      <g fill="#ffcf86"><circle cx="1120" cy="540" r="5"/><circle cx="1320" cy="450" r="4"/><circle cx="1370" cy="420" r="4"/><rect x="1540" y="500" width="14" height="10"/><rect x="1620" y="500" width="14" height="10"/><rect x="1760" y="520" width="14" height="10"/><circle cx="1005" cy="378" r="6" fill="#ff8a6a"/></g>
      <g stroke="#ffcf86" stroke-width="3" opacity=".45"><path d="M1120 610 v90M1320 610 v60M1370 610 v120M1547 610 v80M1627 610 v50M1767 610 v100"/></g>
    </g>
  </svg>
  <div class="fade"></div>

  <div class="shade" style="position:absolute; right:var(--safe-x); top:var(--safe-y); display:flex; align-items:baseline; gap:24px;">
    <span style="font-size:26px; color:var(--ink-2);">78&deg; &middot; Friday</span>
    <span class="display" style="font-size:64px;">7:40<span class="period">PM</span></span>
  </div>

  <div style="position:absolute; left:var(--safe-x); top:300px; width:840px;">
    <div style="font-size:24px; color:var(--ink-3); letter-spacing:.12em; text-transform:uppercase; font-weight:500;">Pick up where you left off</div>
    <div style="font-size:112px; font-weight:400; letter-spacing:-.04em; line-height:1; margin-top:22px;">Harbor Lights</div>
    <div style="display:flex; align-items:center; gap:16px; margin-top:24px; font-size:30px; color:var(--ink-2);">Season 1, Episode 5 &middot; 52 min <span class="tag">From your films</span></div>
    <div style="display:flex; align-items:center; gap:20px; margin-top:40px; font-size:22px; color:var(--ink-3);"><div class="bar"><i></i></div>18 min in, on Wednesday</div>
    <div style="margin-top:56px;"><span class="play"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="#111"/></svg>Play here</span></div>
  </div>

  <div class="strip shade" style="position:absolute; left:var(--safe-x); bottom:var(--safe-y);">
    <div class="fact"><span class="v" style="font-size:28px"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><path d="M4 11.2L12 4.5l8 6.7"/><path d="M6.2 12.6V19h11.6v-6.4"/></svg>Calm</span></div>
    <div class="fact"><span class="v lamp" style="font-size:28px"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="9.5" r="5"/><path d="M9.5 16h5M10.5 19h3"/></svg>6 on</span><span class="w">in 5 rooms</span></div>
  </div>
  <div class="ok shade"><kbd>OK</kbd>Play here</div>
</div>
</body>
</html>
