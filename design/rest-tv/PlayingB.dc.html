<!doctype html>
<html>
<head><meta charset="utf-8"><title>B: what's playing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="rest-tv.css">
<style>
  .wash { position: absolute; inset: -120px; filter: blur(90px) saturate(1.15); opacity: .8;
    background: radial-gradient(40% 50% at 25% 45%, #2f5f8f, transparent 70%), radial-gradient(40% 45% at 70% 70%, #1f3e5c, transparent 70%),
                radial-gradient(30% 30% at 60% 20%, #4b7f95, transparent 70%), #0d1420; }
  .dark { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,10,14,.15), rgba(8,10,14,.55) 65%); }
  .art { position: absolute; left: 196px; top: 230px; width: 620px; height: 620px; border-radius: 14px; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,.6); }
  .room { display: inline-flex; align-items: center; gap: 12px; height: 54px; padding: 0 22px; border-radius: 999px;
          background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); font-size: 24px; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 41%; background: var(--ink); border-radius: 3px; }
</style>
</head>
<body>
<div class="screen">
  <div class="wash"></div><div class="dark"></div>

  <!-- a stand-in for the album's own picture, which the speaker hands the hub -->
  <div class="art">
    <svg viewBox="0 0 620 620" width="620" height="620">
      <defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b97c4"/><stop offset="1" stop-color="#1b3550"/></linearGradient></defs>
      <rect width="620" height="620" fill="url(#a)"/>
      <circle cx="210" cy="250" r="150" fill="#8cc3cf" opacity=".55"/>
      <circle cx="390" cy="380" r="190" fill="#2d6b6b" opacity=".6"/>
      <circle cx="420" cy="180" r="60" fill="#e8e2cf" opacity=".8"/>
      <path d="M0 520 C 160 470 300 560 620 500 V620 H0z" fill="#10233a" opacity=".7"/>
    </svg>
  </div>

  <div style="position:absolute; left:900px; top:300px; width:860px;">
    <div style="font-size:24px; color:var(--ink-3); display:flex; align-items:center; gap:12px;">
      <svg class="i" width="26" height="26" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>Playing in 2 rooms
    </div>
    <div style="font-size:104px; font-weight:400; letter-spacing:-.035em; line-height:1.02; margin-top:22px;">Blue in Green</div>
    <div style="font-size:40px; color:var(--ink-2); margin-top:16px;">Miles Davis</div>
    <div style="display:flex; align-items:center; gap:20px; margin-top:54px; font-size:22px; color:var(--ink-3); font-variant-numeric:tabular-nums;">
      <span>2:15</span><div class="bar" style="flex:1"><i></i></div><span>5:37</span>
    </div>
    <div style="display:flex; gap:14px; margin-top:44px;">
      <span class="room"><svg class="i" width="24" height="24" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="14" r="3"/><circle cx="12" cy="7" r=".8"/></svg>Living room</span>
      <span class="room"><svg class="i" width="24" height="24" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="14" r="3"/><circle cx="12" cy="7" r=".8"/></svg>Kitchen</span>
    </div>
  </div>

  <div class="shade" style="position:absolute; right:var(--safe-x); top:var(--safe-y); display:flex; align-items:baseline; gap:26px;">
    <span style="font-size:26px; color:var(--ink-2);">78&deg; &middot; Friday, November 20</span>
    <span class="display" style="font-size:64px;">7:40<span class="period">PM</span></span>
  </div>

  <div class="strip shade" style="position:absolute; left:196px; bottom:var(--safe-y);">
    <div class="fact"><span class="v" style="font-size:28px"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><path d="M4 11.2L12 4.5l8 6.7"/><path d="M6.2 12.6V19h11.6v-6.4"/></svg>Calm</span></div>
    <div class="fact"><span class="v lamp" style="font-size:28px"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="9.5" r="5"/><path d="M9.5 16h5M10.5 19h3"/></svg>6 on</span><span class="w">in 5 rooms</span></div>
  </div>
  <div class="ok shade"><kbd>OK</kbd>Pause, louder or quieter</div>
</div>
</body>
</html>
