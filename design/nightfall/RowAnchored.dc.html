<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing:antialiased;
      --ink:#f1eee8; --ink-2:#b9b5ad; --ink-3:#7f7d77; --lamp:#e9b872; --live:#6fcf97;
      --rim:linear-gradient(158deg, rgba(255,255,255,.683), rgba(255,255,255,.08) 34%, rgba(14,14,22,.05) 62%, rgba(255,255,255,.393)); --drop:0 27px 61px -26px rgba(17,19,28,.666), 0 2px 10px rgba(17,19,28,.32); --inner:inset 0 -46px 56px -48px rgba(22,25,33,.9); }
    .gl { backdrop-filter: blur(26px) saturate(1.61) brightness(1.043); box-shadow: var(--inner), var(--drop); }
    .sf { box-shadow: inset 0 -40px 54px -48px rgba(30,20,50,.4), var(--drop); }
    .gl::after, .sf::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
      padding:1.4px; background:var(--rim);
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
      mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude; }
    .gl::before { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
      background:linear-gradient(112deg, transparent 26%, rgba(255,255,255,.14) 45%, rgba(255,255,255,.02) 56%, transparent 64%); }
    .cap { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); }
    .dsp { font-weight:400; letter-spacing:-.025em; }
    .tag { display:inline-flex; align-items:center; height:26px; padding:0 12px; border-radius:999px;
      font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
      background:rgba(255,255,255,.16); color:rgba(255,255,255,.88); }
    .tag.on { background:rgba(255,255,255,.9); color:#1d2430; }
  </style>
</helmet>

<!-- ROWANCHORED -- Anchored — three heights, not two. Tall cards 83%, the scenes card 92%. The reference’s own numbers.
     Same cards, same widths, same 18px gaps, same band. The band is measured off
     the running panel at 1440x900: --row 264, so a glance pair spans 546. Only
     how tall a full card may be, and where it sits in that band, moves. -->

  <div style="position:absolute;left:0;right:0;top:14px;display:grid;place-items:center;">

      <defs><linearGradient id="bz" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#fdf7fb"/><stop offset="52%" stop-color="#cdbcd2"/><stop offset="100%" stop-color="#8e7d98"/></linearGradient>
        <radialGradient id="fc" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#3b3550"/><stop offset="72%" stop-color="#1d1930"/><stop offset="100%" stop-color="#100e1e"/></radialGradient></defs>

  </div>
  <div style="position:absolute;left:14px;right:14px;top:158px;display:flex;align-items:center;justify-content:space-between;">
    <span style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></span>
    <span style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
  </div>
  <div style="position:absolute;left:14px;right:14px;bottom:12px;text-align:center;font-size:12.5px;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Currently 74°F · Cooling</div></div>
  
  <div class="gl" style="position:absolute;left:1064px;top:227px;width:324px;height:453px;border-radius:26px;overflow:hidden;background:linear-gradient(148deg, oklch(.407 .014 280 / .34), oklch(.337 .012 280 / .12) 46%, oklch(.367 .014 280 / .24));">
  <div style="position:absolute;inset:0;background:radial-gradient(86% 64% at 72% 16%, rgba(226,72,184,.3), transparent 64%), radial-gradient(60% 46% at 24% 104%, rgba(226,72,184,.2), transparent 70%);"></div>

  <span style="position:absolute;left:18px;top:16px;width:34px;height:34px;border-radius:50%;background:rgb(226,72,184);display:grid;place-items:center;color:#2a0820;z-index:2;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.1 1.4 1.2 2.3h5c.1-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z"/></svg></span>

  <div class="gl" style="position:absolute;left:1406px;top:202px;width:322px;height:502px;border-radius:26px;overflow:hidden;background:linear-gradient(148deg, oklch(.407 .014 280 / .34), oklch(.337 .012 280 / .12) 46%, oklch(.367 .014 280 / .24));">
