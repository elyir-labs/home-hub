<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The front page's two screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* hub.elyir.com's top as shipped (site/index.html), with only its pictures and its light or dark changed per board.
   ?board=<id> draws one board, which is how each .dc.html shows it. The pictures are the panel on the pretend house
   (NAMES=plain, LOCKED=1 so no Set a passcode band), taken 28 October; today-* are site/shots/ as they are live. */
:root {
  --ground: #0c0d10; --surface: #15171c; --line: rgba(255, 255, 255, .1); --ink: #f1eee8; --quiet: #b9b5ad;
  --faint: #8f8c85; --lamp: #e9b872; --lamp-text: #e9b872; --on-lamp: #2a1c07; --bezel: #030405;
  --glow: rgba(233, 184, 114, .10); --shadow: 0 40px 90px rgba(0, 0, 0, .55);
  --font: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
:root[data-shade=light] {
  --ground: #f4f2ee; --surface: #ffffff; --line: rgba(28, 26, 22, .12); --ink: #1c1a16; --quiet: #57534b;
  --faint: #6f6b62; --lamp-text: #8a5f1f; --bezel: #16181d; --glow: rgba(233, 184, 114, .18);
  --shadow: 0 28px 60px rgba(28, 24, 16, .22);
}
* { box-sizing: border-box }
html, body { margin: 0; background: var(--ground); color: var(--ink); overflow: hidden }
body { font: 16px/1.55 var(--font); -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(1100px 560px at 75% 12%, var(--glow), transparent 62%); background-repeat: no-repeat }
.page { overflow-x: clip; padding: 0 40px 48px }
.phone-page .page { padding-inline: 16px }
.wrap { max-width: 1328px; margin: 0 auto }
h1, h2, h3, p { margin: 0 }
h1, h2 { font-weight: 500; letter-spacing: -.025em; text-wrap: balance }

nav { display: flex; align-items: center; gap: 12px; height: 76px }
.home { display: inline-flex; align-items: center; gap: 12px; font-weight: 500; font-size: 17px }
nav .links { margin-left: auto; display: flex; align-items: center; gap: 30px; font-size: 15px; color: var(--quiet) }
nav .links .signin { color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px }
.phone-page nav .links span:not(.signin) { display: none }

.pill { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 24px; border-radius: 999px;
  font: 500 16px var(--font); white-space: nowrap; border: 1px solid var(--line); color: var(--ink) }
.pill.lamp { background: var(--lamp); border-color: transparent; color: var(--on-lamp) }
.pill.sm { height: 42px; padding: 0 18px; font-size: 15px }
.label { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--lamp-text) }
.lede { color: var(--quiet); font-size: 19px; max-width: 46ch }
.fine { color: var(--faint); font-size: 14px }

.hero { display: grid; grid-template-columns: minmax(0, 500px) minmax(0, 1fr); gap: 48px; padding-block: 36px 24px; align-items: start }
.say { display: grid; gap: 22px; padding-top: 24px }
.say h1 { font-size: 64px; line-height: 1.02 }
.doors { display: flex; flex-wrap: wrap; gap: 12px }
.pics { position: relative; min-height: 660px }
.pics .wall { position: absolute; right: -110px; top: 0; width: 800px }
.pics .phone { position: absolute; left: -20px; top: 250px; width: 196px; height: 400px; overflow: hidden }
.wall { background: var(--bezel); border: 1px solid rgba(255, 255, 255, .09); border-radius: 22px; padding: 12px; box-shadow: var(--shadow) }
.phone { background: var(--bezel); border: 1px solid rgba(255, 255, 255, .12); border-radius: 40px; padding: 9px; box-shadow: var(--shadow) }
.wall img, .phone img { display: block; width: 100%; height: auto; border-radius: 10px }
.phone img { border-radius: 31px }
.pics figcaption { position: absolute; right: 0; top: 548px; width: 520px; font-size: 14px; color: var(--faint); text-align: right }

.phone-page .hero { grid-template-columns: minmax(0, 1fr); gap: 32px; padding-block: 16px 40px }
.phone-page .say { padding-top: 0 }
.phone-page .say h1 { font-size: 40px }
.phone-page .doors .pill { flex: 1 1 100% }
.phone-page .doors .door-try { order: -1; background: var(--lamp); color: var(--on-lamp); border-color: transparent }
.phone-page .doors .door-get { background: none; color: var(--ink); border-color: var(--line) }
.phone-page .pics { min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 10px }
.phone-page .pics .wall { display: none }
.phone-page .pics .phone { position: static; width: 270px; height: 360px }
.phone-page .pics figcaption { position: static; width: auto; text-align: center }

.ask { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 10px }
.ask p { font-size: 15.5px; color: var(--quiet) }
.ask p b { font-weight: 500; color: var(--ink) }
.list { display: flex; gap: 10px }
.list .field { flex: 1; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: rgba(127, 127, 127, .06); color: var(--faint); font-size: 15px; padding: 0 14px; display: flex; align-items: center }

/* C, one scroll down: the same wall through a day. */
.day { border-top: 1px solid var(--line); padding-block: 44px; display: grid; gap: 28px }
.day .lines { display: grid; gap: 14px; max-width: 760px }
.day h2 { font-size: 42px; line-height: 1.08 }
.day .lines p:not(.label) { color: var(--quiet); font-size: 18px }
.day .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px }
.day figure { margin: 0; display: grid; gap: 12px }
.day figure .wall { padding: 8px; border-radius: 16px }
.day figure .wall img { border-radius: 8px }
.day figcaption { font-size: 15px; color: var(--quiet) }
.day figcaption b { color: var(--ink); font-weight: 500 }
.phone-page .day h2 { font-size: 30px }
.phone-page .day .three { grid-template-columns: minmax(0, 1fr); gap: 20px }
</style>
</head>
<body>
<div class="page"><div class="wrap" id="board"></div></div>
<script>
/* Each board: the page's shade, the two pictures, and anything it adds. */
const BOARDS = {
  today:           { shade: 'light', wall: 'today-wall.jpg', phone: 'today-phone-light.jpg' },
  'today-dark':    { shade: 'dark', wall: 'today-wall.jpg', phone: 'today-phone-dark.jpg' },
  a:               { shade: 'light', wall: 'wall-day.jpg', phone: 'phone-day.jpg' },
  'a-dark':        { shade: 'dark', wall: 'wall-evening.jpg', phone: 'phone-evening.jpg' },
  b:               { shade: 'light', wall: 'wall-day-room.jpg', phone: 'phone-day-room.jpg', caption: 'The living room, on the wall and on a phone.' },
  'b-dark':        { shade: 'dark', wall: 'wall-evening-room.jpg', phone: 'phone-evening-room.jpg', caption: 'The living room, on the wall and on a phone.' },
  c:               { shade: 'light', wall: 'wall-day.jpg', phone: 'phone-day.jpg' },
  'c-more':        { shade: 'light', more: true },
  'today-phone':   { shade: 'light', phone: 'today-phone-light.jpg', small: true },
  'b-phone':       { shade: 'light', phone: 'phone-day-room.jpg', small: true, caption: 'The living room, on a phone. The wall shows it the same way.' },
  'c-phone':       { shade: 'light', phone: 'phone-day.jpg', small: true },
  d:               { shade: 'light', wall: 'wall-day-room.jpg', phone: 'phone-day-room.jpg', caption: 'The living room, on the wall and on a phone.' },
  'd-dark':        { shade: 'dark', wall: 'wall-evening-room.jpg', phone: 'phone-evening-room.jpg', caption: 'The living room, on the wall and on a phone.' },
  'd-more':        { shade: 'light', more: true, strip: ['wall-morning.jpg', 'wall-day.jpg', 'wall-evening-light.jpg'], say: 'either' },
  'd-more-dark':   { shade: 'dark', more: true, strip: ['wall-morning-dark.jpg', 'wall-day-dark.jpg', 'wall-evening.jpg'], say: 'either' },
  'd-phone':       { shade: 'light', phone: 'phone-day-room.jpg', small: true, caption: 'The living room, on the wall and on a phone.' },
  'd-phone-dark':  { shade: 'dark', phone: 'phone-evening-room.jpg', small: true, caption: 'The living room, on the wall and on a phone.' },
}
const SAY = {
  light: 'The wall tells the time by the color of its sky. Prefer it dark for a room with the lamps low? Choose that on the wall, and each phone chooses for itself.',
  either: 'The wall tells the time by the color of its sky, in Light or in Dark. Choose which on the wall, and each phone chooses for itself.',
}
const id = new URLSearchParams(location.search).get('board') || 'today'
const b = BOARDS[id] || BOARDS.today
document.documentElement.dataset.shade = b.shade
if (b.small) document.body.classList.add('phone-page')

const mark = `<svg width="28" height="28" viewBox="84 92 344 336" aria-hidden="true"><path d="M112 248 256 120l144 128" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M148 226v170h216V226" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><circle cx="256" cy="306" r="32" fill="#e9b872"/></svg>`
const nav = `<nav><span class="home">${mark}Elyir Home Hub</span><div class="links"><span>Try it</span><span>Get it</span><span>Use it anywhere</span><span class="signin">Sign in</span></div></nav>`

const hero = () => `${nav}
<header class="hero">
  <div class="say">
    <p class="label">Elyir Home Hub</p>
    <h1>Your house, on one screen.</h1>
    <p class="lede">Lights, locks, cameras and the thermostat, on a screen on the wall and every phone in the house. Setting it up is a few questions. It keeps working when the internet is down.</p>
    <div class="doors"><span class="pill lamp door-get">Put it on a computer you have</span><span class="pill door-try">Try it live</span></div>
    <p class="fine">Free and open source · a Raspberry Pi 5, a NUC or a mini PC</p>
    <div class="ask">
      <p><b>Want one ready to plug in?</b> We're making one. Leave your email and we'll write once, when it's ready.</p>
      <div class="list"><span class="field">you@example.com</span><span class="pill sm">Tell me</span></div>
    </div>
  </div>
  <div class="pics">
    ${b.wall ? `<div class="wall"><img src="shots/${b.wall}" alt=""></div>` : ''}
    <div class="phone"><img src="shots/${b.phone}" alt=""></div>
    ${b.caption ? `<figcaption>${b.caption}</figcaption>` : ''}
  </div>
</header>`

const more = () => `${nav}
<section class="day">
  <div class="lines">
    <p class="label">Through the day</p>
    <h2>It changes with the sky outside</h2>
    <p>${SAY[b.say || 'light']}</p>
  </div>
  <div class="three">
    ${(b.strip || ['wall-morning.jpg', 'wall-day.jpg', 'wall-evening-light.jpg']).map((f, i) =>
      `<figure><div class="wall"><img src="shots/${f}" alt=""></div><figcaption><b>${['8:30 in the morning', '1:00 in the afternoon', '7:40 in the evening'][i]}</b></figcaption></figure>`).join('')}
  </div>
</section>`

document.getElementById('board').innerHTML = b.more ? more() : hero()
</script>
</body>
</html>
