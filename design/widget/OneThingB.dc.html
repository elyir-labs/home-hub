<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; -webkit-font-smoothing: antialiased; }
    .phone { position: relative; width: 390px; height: 844px; overflow: hidden; }
    .shot { position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: block; }
    /* the wallpaper under the two rows of icons, so a widget can sit where the empty space is */
    .cover { position: absolute; left: 0; right: 0; top: 268px; height: 300px; background: linear-gradient(180deg, rgba(10,22,60,0) 0%, rgba(10,22,60,0) 100%); }
    /* a widget in the house's own colors: the night of the app's icon, its ink and its lamp (app/public/icon.svg) */
    .w { position: absolute; border-radius: 22px; overflow: hidden; color: #f1eee8; font-family: "Plus Jakarta Sans", -apple-system, system-ui, sans-serif;
         background: linear-gradient(#1a1d24, #0c0d10); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .w::before { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 100%, rgba(233,184,114,.18), transparent 70%); }
    .w > * { position: relative; }
    .cap { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8d8a84; }
    .big { font-size: 26px; font-weight: 400; letter-spacing: -.02em; }
    .line { font-size: 13px; line-height: 17px; color: #b9b5ad; }
    .needs { color: #e9b872; }
    .lamp { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e9b872; box-shadow: 0 0 10px rgba(233,184,114,.8); }
    .pill { height: 34px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 500; }
    .label { position: absolute; font-family: -apple-system, system-ui, sans-serif; font-size: 12px; color: #fff; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  </style>
</helmet>
<!-- B -- ONE THING. A small widget set to one thing in one house -- the garage door, the front lock -- saying how it is, and a tap that changes it. The lock screen gets the same as one line. -->
<div class="phone"><img class="shot" src="shots/home.png" alt="">
  <div class="w" style="left: 24px; top: 288px; width: 164px; height: 164px; padding: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f1eee8" stroke-width="1.6" stroke-linejoin="round"><path d="M3 10l9-6 9 6v10H3z"/><path d="M6 20v-7h12v7M6 15.5h12M6 18h12"/></svg>
      <span class="cap">Home</span></div>
    <div style="font-size: 17px; font-weight: 500; margin-top: 22px;">Garage door</div>
    <div class="line" style="margin-top: 2px;">Closed · 2 hours</div>
    <div class="pill" style="position: absolute; left: 16px; right: 16px; bottom: 14px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14);">Open it</div>
  </div>
  <div class="w" style="left: 202px; top: 288px; width: 164px; height: 164px; padding: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e9b872" stroke-width="1.7" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.4"/><path d="M8.4 10.5V7.6a3.6 3.6 0 017.2 0"/></svg>
      <span class="cap">Home</span></div>
    <div style="font-size: 17px; font-weight: 500; margin-top: 22px;">Front door</div>
    <div class="line needs" style="margin-top: 2px;">Unlocked · 5 min</div>
    <div class="pill" style="position: absolute; left: 16px; right: 16px; bottom: 14px; background: #e9b872; color: #2a1c07;">Lock it</div>
  </div>
  <div class="label" style="left: 24px; width: 164px; top: 458px;">Houses</div>
  <div class="label" style="left: 202px; width: 164px; top: 458px;">Houses</div>
  <div style="position: absolute; left: 24px; top: 498px; width: 342px; height: 1px; background: rgba(255,255,255,.18);"></div>
  <div class="label" style="left: 24px; width: 342px; top: 510px; text-align: left; opacity: .8;">ON THE LOCK SCREEN</div>
  <div style="position: absolute; left: 24px; top: 532px; width: 172px; height: 72px; border-radius: 18px; background: rgba(255,255,255,.16); backdrop-filter: blur(12px); color: #fff; font-family: -apple-system, system-ui, sans-serif; padding: 10px 14px;">
    <div style="font-size: 13px; opacity: .8;">Garage door</div><div style="font-size: 20px; font-weight: 600;">Closed</div></div>
</div>
</x-dc>
</body>
</html>
