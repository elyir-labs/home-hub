<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; -webkit-font-smoothing: antialiased; }
    .phone { position: relative; width: 390px; height: 844px; overflow: hidden; }
    .shot { position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: block; }
    /* the wallpaper under the two rows of icons, so a widget can sit where the empty space is */
    .cover { position: absolute; left: 0; right: 0; top: 268px; height: 300px; background: linear-gradient(180deg, rgba(10,22,60,0) 0%, rgba(10,22,60,0) 100%); }
    /* a widget in the house's own colors: the night of the app's icon, its ink and its lamp (app/public/icon.svg) */
    .w { position: absolute; border-radius: 22px; overflow: hidden; color: #f1eee8; font-family: "Plus Jakarta Sans", -apple-system, system-ui, sans-serif;
         background: linear-gradient(#1a1d24, #0c0d10); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .w::before { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 100%, rgba(233,184,114,.18), transparent 70%); }
    .w > * { position: relative; }
    .cap { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8d8a84; }
    .big { font-size: 26px; font-weight: 400; letter-spacing: -.02em; }
    .line { font-size: 13px; line-height: 17px; color: #b9b5ad; }
    .needs { color: #e9b872; }
    .lamp { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e9b872; box-shadow: 0 0 10px rgba(233,184,114,.8); }
    .pill { height: 34px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 500; }
    .label { position: absolute; font-family: -apple-system, system-ui, sans-serif; font-size: 12px; color: #fff; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  </style>
</helmet>
