<!doctype html>
<html>
<head><meta charset="utf-8"><title>D on the phone: the remote, what's next, and the lamps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap">
<link rel="stylesheet" href="media.css">
<style>
  .pad { position: absolute; left: 20px; right: 20px; bottom: 40px; height: 132px; border-radius: 28px; background: rgba(255,255,255,.05); border: 1px solid var(--edge);
         display: grid; place-items: center; }
  .pad .ok { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--edge-hi); display: grid; place-items: center; font-size: 15px; color: var(--ink-2); }
  .tg { width: 46px; height: 28px; border-radius: 999px; background: var(--lamp); position: relative; flex: none; }
  .tg::after { content: ""; position: absolute; right: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--lamp-ink); }
</style>
</head>
<body>
<div class="phone">
  <div class="top"><span style="font-size: 22px;">&lsaquo;</span><span>Living room</span></div>
  <div style="position: absolute; left: 20px; right: 20px; top: 98px;">
    <h2>The TV</h2>
    <div class="card" style="margin-top: 16px;">
      <div class="still s-field" style="height: 108px; border-radius: 0;"><div class="line"><i style="width: 40%"></i></div></div>
      <div style="padding: 14px 16px 16px;">
        <div class="label">Keep watching &middot; 1 h 12 min left</div>
        <div style="font-family: var(--display); font-size: 26px; margin: 4px 0 12px;">The Long Field</div>
        <div class="pbtn">&#9654;&ensp;Keep watching on the TV</div>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 15px;"><span style="color: var(--lamp); display: inline-flex;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></span><span style="flex: 1;">Lamps down while it plays<br><small class="muted">Living room to 10%, back to 60% after</small></span><span class="tg"></span></div>
      </div>
    </div>
    <div class="label" style="margin: 16px 0 0;">Next</div>
    <div class="li"><div class="still s-harbor"></div><span><b>Harbor Lights</b><small>Episode 4 came in this morning</small></span></div>
    <div class="li"><div class="still s-ember"></div><span><b>Salt &amp; Ember</b><small>Jordan added it yesterday</small></span></div>
  </div>
  <div class="pad"><div class="ok">OK</div>
    <span style="position: absolute; bottom: 8px; font-size: 12px; color: var(--muted);">Swipe to move on the TV</span></div>
</div>
</body>
</html>
