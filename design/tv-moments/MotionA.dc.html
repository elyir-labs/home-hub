  .ph { position: absolute; inset: 0; width: 100%; height: 100%; }

  .cap { font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }

  .slide { position: absolute; inset: 0; opacity: 0; animation: show 24s infinite; overflow: hidden; }
  .slide:nth-of-type(2) { animation-delay: 6s; } .slide:nth-of-type(3) { animation-delay: 12s; } .slide:nth-of-type(4) { animation-delay: 18s; }
  @keyframes show { 0% { opacity: 0; filter: blur(8px); } 6% { opacity: 1; filter: blur(0); } 25% { opacity: 1; } 31% { opacity: 0; filter: blur(6px); } 100% { opacity: 0; } }
  .move { position: absolute; inset: 0; animation-duration: 7.5s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
  .slide:nth-of-type(2) .move { animation-delay: 6s; } .slide:nth-of-type(3) .move { animation-delay: 12s; } .slide:nth-of-type(4) .move { animation-delay: 18s; }
  .kb-a { animation-name: zoomin; transform-origin: 62% 56%; } .kb-b { animation-name: panleft; } .kb-c { animation-name: zoomout; } .kb-d { animation-name: rise; }
  @keyframes zoomin { from { transform: scale(1.02); } to { transform: scale(1.18); } }
  @keyframes panleft { from { transform: scale(1.14) translateX(4%); } to { transform: scale(1.14) translateX(-4%); } }
  @keyframes zoomout { from { transform: scale(1.2); } to { transform: scale(1.03); } }
  @keyframes rise { from { transform: scale(1.12) translateY(3%); } to { transform: scale(1.12) translateY(-3%); } }
  .fillblur { position: absolute; inset: -60px; filter: blur(50px) saturate(1.1); opacity: .8; }
  .tall { position: absolute; left: 50%; top: 54px; width: 540px; height: 720px; margin-left: -270px; overflow: hidden; border-radius: 6px; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
