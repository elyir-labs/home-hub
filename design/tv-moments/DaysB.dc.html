<!doctype html>
<html>
<head><meta charset="utf-8"><title>B: a day of photos plays as a little story, and a year ago comes first</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="tv.css">
<style>
  .ph { position: absolute; inset: 0; width: 100%; height: 100%; }

  .collage > div { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }

</div><script>
  document.querySelectorAll('.flip').forEach(f => f.onclick = () => {
    document.getElementById('s').dataset[f.dataset.k] = f.dataset.v
    document.querySelectorAll(`.flip[data-k="${f.dataset.k}"]`).forEach(g => g.classList.toggle('on', g === f))
  })
</script>
