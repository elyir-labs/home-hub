<!doctype html>
<html>
<head><meta charset="utf-8"><title>A: the morning card, the first time a screen wakes after sunrise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="tv.css">
<style>
  .ph { position: absolute; inset: 0; width: 100%; height: 100%; }
  .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; letter-spacing: -.01em; }
  .cap { font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }
  [data-m="line"] .m-note, [data-m="note"] .m-line { display: none; }</style>
</head>
<body>
<div class="screen" id="s" data-m="line">
  <div class="try" style="top:14px"><span>Show</span><span class="flip on" data-k="m" data-v="line">The line for the day</span><span class="flip" data-k="m" data-v="note">A note left last night</span></div>
  <div style="position:absolute; inset:0; background:radial-gradient(50% 40% at 75% 95%, rgba(255,214,170,.55), transparent 70%), linear-gradient(180deg,#3b4f7d 0%,#7f8fb8 45%,#e3b9a7 80%,#f3cfa3 100%);"></div><div class="fill" style="background:rgba(12,14,22,.28)"></div>
  <div class="shade" style="position:absolute; left:160px; top:150px; width:1100px;">
    <div class="cap">Good morning</div>
    <div class="m-line serif" style="font-size:120px; line-height:1.05; margin-top:30px;">You don&rsquo;t have to do it all today. Just the next thing.</div>
    <div class="m-note" style="margin-top:30px;"><div class="serif" style="font-size:120px; line-height:1.05;">Proud of you for yesterday.</div><div style="font-size:30px; color:var(--ink-2); margin-top:24px;">Dad left this last night</div></div>
  </div>
  <div class="shade" style="position:absolute; left:160px; bottom:150px; display:flex; gap:80px; font-size:30px;">
    <div><div class="cap" style="font-size:18px;">Outside</div><div style="margin-top:10px;">Cold and bright: 41&deg; now, 58&deg; by the afternoon</div></div>
    <div><div class="cap" style="font-size:18px;">Waiting</div><div style="margin-top:10px;">Sam&rsquo;s birthday in 3 days</div></div></div>
  <div class="shade" style="position:absolute; right:96px; top:54px;"><span class="display" style="font-size:72px;">7:02<span class="period">AM</span></span></div>
  <div class="ok shade"><kbd>OK</kbd>The living room</div>
</div><script>
  document.querySelectorAll('.flip').forEach(f => f.onclick = () => {
    document.getElementById('s').dataset[f.dataset.k] = f.dataset.v
    document.querySelectorAll(`.flip[data-k="${f.dataset.k}"]`).forEach(g => g.classList.toggle('on', g === f))
  })
</script>
</body>
</html>
