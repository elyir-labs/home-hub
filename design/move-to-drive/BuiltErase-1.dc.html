<!doctype html>
<html>
<head><meta charset="utf-8"><title>As built: the box, waiting for erase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="screen.css">
<link rel="stylesheet" href="try.css">
</head>
<body>
<div class="glass">
  <div class="house small" data-lamp="1"></div>
  <div class="title">Erase this drive?</div>
  <div class="card"><span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d9d5cd" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 12h.01M11 12h6"/></svg></span><span><b>Samsung SSD 980 · 512 GB</b><small><i>Ubuntu 24.04, with a hub on it</i> · 61 GB · used yesterday</small></span></div>
  <div class="ask" style="top: 462px">Type <b>erase</b> here, then press Enter</div>
  <div class="entry" style="top: 504px"><span class="caret"></span><span class="hold">erase</span></div>
  <div class="warn" style="top: 600px">This erases Ubuntu 24.04, the hub on it with its house, and 61 GB of files.<br>It can’t be undone.</div>
  <div class="keys" style="top: 700px"><div class="key"><span class="cap">Backspace</span><span>Go back</span></div></div>
</div>
<script src="screen.js"></script>
</body>
</html>
