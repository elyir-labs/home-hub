<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Instrument+Sans:wght@400;500;600&family=Figtree:wght@400;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      /* The wall in the house is the Wall layout with the tabs across the top, which says Plus Jakarta on the
         shell (panel.css: "Wall says Plus Jakarta on the shell"). These are the shipped panel's own tokens. */
      font-family: "Plus Jakarta Sans", "Instrument Sans", -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      --bg: #0c0d10; --surface-rgb: 26,28,34; --surface: rgba(var(--surface-rgb),.68); --surface-hi: rgba(255,255,255,.08);
      --edge: rgba(255,255,255,.1); --edge-hi: rgba(255,255,255,.18);
      --ink: #f1eee8; --ink-2: #b9b5ad; --muted: #7f7d77;
      --ink-3: oklch(0.68 0.01 242); --ink-4: oklch(0.76 0.006 242);
      --lamp-rgb: 233,184,114; --lamp: rgb(var(--lamp-rgb)); --lamp-ink-rgb: 42,28,7; --lamp-ink: rgb(var(--lamp-ink-rgb));
      --live-rgb: 116,198,157; --live: rgb(var(--live-rgb));
      --danger-rgb: 224,138,138; --danger: rgb(var(--danger-rgb));
      --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
    }
    .screen { position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--bg); color: var(--ink); font-size: 17px; line-height: 1.4; }
    /* a phone gets the Stack home, which keeps Instrument Sans */
    .phone { font-family: "Instrument Sans", -apple-system, system-ui, sans-serif; position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--ink); font-size: 17px; line-height: 1.4; }
    .abs { position: absolute; }
    .dsp { font-weight: 400; letter-spacing: -.025em; text-wrap: balance; }
    svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .num { font-variant-numeric: tabular-nums; }
    /* the glass the bar, the round buttons and every bento card are made of (.tabs, .topbar-add, .bento-card) */
    .glass { background-image: linear-gradient(112deg, transparent 26%, rgba(255,255,255,.114) 45%, rgba(255,255,255,.02) 56%, transparent 64%),
                               linear-gradient(148deg, oklch(0.532 0.014 243 / .34), oklch(0.462 0.012 243 / .12) 46%, oklch(0.492 0.014 243 / .24));
             box-shadow: inset 0 -46px 56px -48px rgba(22,40,64,.9), 0 24px 53px -26px rgba(16,33,55,.59), 0 2px 10px rgba(16,33,55,.37); }
    .round { position: absolute; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
    .round.dot::after { content: ''; position: absolute; top: 1px; right: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--lamp);
                        box-shadow: 0 0 8px 1px rgba(var(--lamp-rgb),.85); }
    .tab { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 22px; border-radius: 999px; font-size: 15.5px; color: var(--ink-2); white-space: nowrap; }
    .tab.on { background: rgba(255,255,255,.1); color: var(--ink); font-weight: 500; }
    /* a bento card (.bento-card, .room-cell): 28px on the big ones, 24px on a third */
    .card { position: absolute; border-radius: 28px; border: 1px solid rgba(255,255,255,.07); overflow: hidden; }
    .card.third { border-radius: 24px; }
    .card.lit { border-color: rgba(var(--lamp-rgb),.5); }
    .card.on { border-color: rgba(var(--lamp-rgb),.28); background-color: var(--surface);
               background-image: linear-gradient(135deg, rgba(var(--lamp-rgb),.14), rgba(var(--lamp-rgb),0) 55%); }
    .card.ask { border-color: rgba(var(--lamp-rgb),.7); box-shadow: 0 0 0 1px rgba(var(--lamp-rgb),.25), 0 0 46px -8px rgba(var(--lamp-rgb),.45), 0 24px 53px -26px rgba(16,33,55,.59); }
    .card.fault { border-color: rgba(var(--danger-rgb),.55); background-color: rgba(var(--surface-rgb),.74);
                  background-image: linear-gradient(150deg, rgba(var(--danger-rgb),.16), rgba(var(--danger-rgb),0) 60%); }
    .card.drained { border-color: rgba(var(--live-rgb),.35); }
    .card.dark { background: rgb(17,19,24); border-color: var(--edge); }
    .card.waiting { border: 1.5px dashed rgba(var(--lamp-rgb),.5); }
    .cname { font-size: 19px; font-weight: 500; letter-spacing: -.01em; }
    .cline { font-size: 13.5px; color: var(--ink-2); }
    .chip { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 11.5px;
            letter-spacing: .1em; text-transform: uppercase; background: rgba(12,13,16,.55); color: var(--ink); white-space: nowrap; }
    .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); display: block; }
    .chip.rec i { background: var(--danger); }
    /* the band (.nudge), at its shipped values */
    .nudges { position: absolute; display: flex; gap: 10px; }
    .nudge { display: inline-flex; align-items: center; gap: 12px; height: 57px; padding: 8px 20px 8px 8px; border-radius: 26px;
             background: linear-gradient(rgba(var(--lamp-rgb),.1), rgba(var(--lamp-rgb),.1)), rgba(var(--surface-rgb),.68); border: 1px solid rgba(var(--lamp-rgb),.3); white-space: nowrap; }
    .nudge .ni { width: 32px; height: 32px; border-radius: 10px; background: var(--lamp); color: var(--lamp-ink); display: grid; place-items: center; flex: none; margin-left: 1px; }
    .nudge b { display: block; font-size: 15px; font-weight: 500; line-height: 21px; }
    .nudge small { display: block; font-size: 13px; line-height: 17px; color: var(--ink-2); }
    .nudge.fault .ni { background: var(--danger); color: #2a0e0e; }
    .nudge.new { box-shadow: 0 0 0 4px rgba(var(--lamp-rgb),.12); }
    /* words a printer said, quoted where the panel draws them */
    .lbl { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
    .bar { position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: hidden; }
    .bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ink); display: block; }
    .bar.lamp > i { background: var(--lamp); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 49px; padding: 0 22px; border-radius: 999px;
           background: var(--ink); color: var(--bg); font-weight: 500; font-size: 16px; white-space: nowrap; }
    .btn.ghost { background: rgba(255,255,255,.08); color: var(--ink); border: 1px solid var(--edge); }
    .btn.lampb { background: var(--lamp); color: var(--lamp-ink); }
    .btn.small { height: 40px; padding: 0 16px; font-size: 14.5px; }
    .btn.tiny { height: 34px; padding: 0 14px; font-size: 13.5px; }
    .reading { display: inline-flex; align-items: center; gap: 8px; height: 39px; padding: 0 14px 0 12px; border-radius: 999px; font-size: 14px; color: var(--ink-2);
               background: rgba(var(--surface-rgb),.68); border: 1px solid var(--edge); white-space: nowrap; }
    .reading b { color: var(--ink); font-weight: 500; }
    .temp { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 16px; border: 1px solid var(--edge); background: rgba(255,255,255,.04); }
    .temp small { font-size: 12.5px; color: var(--ink-3); }
    .temp b { font-size: 22px; font-weight: 400; letter-spacing: -.02em; }
    .temp b em { font-style: normal; font-size: 14px; color: var(--ink-3); }
    .pane { position: absolute; left: 0; top: 225px; width: 1440px; height: 675px; border-radius: 34px 34px 0 0; overflow: hidden;
            background: linear-gradient(rgba(26,28,34,.8), rgba(16,17,21,.94)); box-shadow: inset 0 1.4px 0 rgba(255,255,255,.38), 0 -18px 40px -14px rgba(17,35,60,.53); }
    .row { display: flex; align-items: center; gap: 14px; padding: 14px 14px 14px 14px; border-radius: 20px; border: 1px solid var(--edge); background: rgba(255,255,255,.05); }
    .row .ri { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--lamp); color: var(--lamp-ink); flex: none; }
    .row .ri.plain { background: rgba(255,255,255,.08); color: var(--ink-2); }
    .row b { display: block; font-size: 16.5px; font-weight: 500; }
    .row small { display: block; font-size: 13.5px; color: var(--ink-3); }
    .row .go { margin-left: auto; }
    /* ANNOTATION, NEVER PANEL: dashed, and in the board's own voice. Nothing inside one is a screen. */
    .note { position: absolute; border: 1px dashed rgba(255,255,255,.26); border-radius: 18px; padding: 16px 18px; background: rgba(8,9,12,.93);
            font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
    .note b { color: var(--ink); font-weight: 500; }
    .note p { margin: 8px 0 0; }
    .cap { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .key { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--muted); letter-spacing: 0; text-transform: none; }
    /* the pane's quiet choice, as "Show this as" draws it: a word with a dashed underline */
    .choose { color: var(--ink-3); text-decoration: underline; text-decoration-style: dashed; text-underline-offset: 4px; }
    .lead { position: absolute; border-top: 1px dashed rgba(255,255,255,.34); }
    .leadv { position: absolute; border-left: 1px dashed rgba(255,255,255,.34); }
  </style>
</helmet>
