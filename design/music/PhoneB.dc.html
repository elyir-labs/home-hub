<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>B on the phone: the same card, first on Your evening</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Instrument Sans", -apple-system, "SF Pro Text", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      /* the panel's own tokens -- app/src/panel.css */
      --bg: #0c0d10; --surface-rgb: 26,28,34; --surface: rgba(var(--surface-rgb),.68); --surface-hi: rgba(255,255,255,.08);
      --edge: rgba(255,255,255,.1); --edge-hi: rgba(255,255,255,.18);
      --ink: #f1eee8; --ink-2: #b9b5ad; --muted: #7f7d77;
      --lamp-rgb: 233,184,114; --lamp: rgb(var(--lamp-rgb)); --lamp-ink-rgb: 42,28,7; --lamp-ink: rgb(var(--lamp-ink-rgb));
      --live-rgb: 116,198,157; --live: rgb(var(--live-rgb));
      --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
      /* the glass at night, as the shipped panel computes it at 7:40 PM */
      --sweep: linear-gradient(112deg, transparent 26%, rgba(255,255,255,.15) 45%, rgba(255,255,255,.02) 56%, transparent 64%);
      --glass: linear-gradient(148deg, oklch(0.357 0.014 274 / .34), oklch(0.287 0.012 274 / .12) 46%, oklch(0.317 0.014 274 / .24));
      --lit: linear-gradient(155deg, oklch(0.377 0.047 76), oklch(0.322 0.047 82));
      --depth: inset 0 -46px 56px -48px rgba(14,16,21,.9), 0 28px 64px -26px rgba(10,11,17,.69), 0 2px 10px rgba(10,11,17,.3);
    }
    .screen { position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--bg); color: var(--ink); font-size: 17px; line-height: 1.4; }
    .screen.phone { width: 390px; height: 844px; }
    .abs { position: absolute; }
    svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .gl { background-image: var(--sweep), var(--glass); box-shadow: var(--depth); }
    .gl::after, .tile::after, .scene::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1.4px;
      background: linear-gradient(158deg, rgba(255,255,255,.42), rgba(255,255,255,.06) 34%, rgba(14,14,22,.02) 62%, rgba(255,255,255,.24));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
    .round { position: absolute; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
    .tab { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 22px; white-space: nowrap; border-radius: 999px; font-size: 15.5px; color: var(--ink-2); }
    .tab.on { background: rgba(255,255,255,.1); color: var(--ink); font-weight: 500; }
    .link { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .link i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
    .tile { position: absolute; border-radius: 24px; border: 1px solid transparent; background-image: var(--sweep), var(--glass); box-shadow: var(--depth); overflow: hidden; }
    .tile.big { border-radius: 28px; }
    .tile.lit { background-image: var(--sweep), var(--lit); border-color: rgba(var(--lamp-rgb),.3); }
    .tile.playing { background-image: var(--sweep), linear-gradient(135deg, rgba(var(--lamp-rgb),.14), rgba(var(--lamp-rgb),0) 55%), var(--glass); border-color: rgba(var(--lamp-rgb),.28); }
    .tn { position: absolute; left: 19px; top: 16px; right: 18px; display: flex; align-items: center; gap: 11px; font-size: 16px; font-weight: 500; letter-spacing: -.005em; }
    .tn svg { color: var(--ink-2); }
    .lit .tn svg { color: var(--lamp); }
    .ts { position: absolute; left: 19px; right: 18px; bottom: 15px; font-size: 14.5px; color: var(--ink-2); }
    .scene { position: relative; height: 64px; border-radius: 17px; background: rgba(255,255,255,.055); box-shadow: var(--depth); display: flex; align-items: center; gap: 16px; padding: 0 16px; }
    .scene svg { color: var(--ink-2); }
    .scene b { display: block; font-weight: 400; font-size: 17px; line-height: 21px; }
    .scene small { display: block; font-size: 13px; color: var(--ink-2); line-height: 18px; }
    .cap { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .reading { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 11px; border-radius: 999px; font-size: 14px; color: var(--ink-2);
               background: var(--surface); border: 1px solid var(--edge); white-space: nowrap; }
    .reading b { color: var(--ink); font-weight: 500; }
    /* what is playing: the shipped .tile.media grid -- 96px art, the speaker's name in capitals, the title, then 40px buttons */
    .mart { position: absolute; width: 96px; height: 96px; border-radius: 14px; overflow: hidden; background: var(--surface-hi); display: grid; place-items: center; color: var(--muted); }
    .mname { font-size: 13.5px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-2); }
    .mtitle { font-size: 19px; font-weight: 500; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msub { font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctls { display: flex; align-items: center; gap: 6px; }
    .ctl { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); background: var(--surface-hi); flex: none; }
    .ctl.primary { background: var(--lamp); color: var(--lamp-ink); }
    .mbar { flex: 1 1 auto; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); position: relative; }
    .mbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: rgba(255,255,255,.72); }
    .chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 999px; font-size: 13.5px; color: var(--ink-2);
            background: rgba(255,255,255,.06); border: 1px solid var(--edge); white-space: nowrap; flex: none; }
    .chip.on { background: rgba(var(--lamp-rgb),.9); color: var(--lamp-ink); border-color: transparent; font-weight: 500; }
    .chip .cv { width: 22px; height: 22px; border-radius: 6px; margin-left: -6px; flex: none; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; font-size: 15px; font-weight: 600;
           background: var(--lamp); color: var(--lamp-ink); white-space: nowrap; flex: none; }
    .btn.quiet { background: var(--surface-hi); color: var(--ink); font-weight: 500; border: 1px solid var(--edge); }
    /* a cover: the household's own playlists and stations, drawn as their artwork would sit */
    .cover { position: relative; border-radius: 14px; overflow: hidden; flex: none; box-shadow: 0 10px 24px -12px rgba(0,0,0,.7); }
    .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.18), transparent 40%); }
    .cover.round-c { border-radius: 50%; }
    .ct { margin-top: 8px; font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cs { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sh { white-space: nowrap; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    /* the pane over the room, the way a tile's pane opens today: the room stays under it, dimmed */
    .veil { position: absolute; inset: 0; background: rgba(8,9,12,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .pane { position: absolute; border-radius: 28px; background: rgba(22,23,29,.96); border: 1px solid var(--edge); box-shadow: 0 40px 90px -30px rgba(0,0,0,.85); overflow: hidden; }
    .search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--edge); color: var(--muted); font-size: 15px; }
    .roomrow { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--edge); background: rgba(255,255,255,.04); }
    .roomrow b { display: block; font-weight: 500; font-size: 15.5px; line-height: 20px; }
    .roomrow small { display: block; font-size: 12.5px; color: var(--ink-2); line-height: 17px; }
    .roomrow.on { border-color: rgba(var(--lamp-rgb),.55); background: rgba(var(--lamp-rgb),.1); }
    .tick { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--edge-hi); display: grid; place-items: center; flex: none; }
    .on > .tick { background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink); }
    .toast { position: absolute; left: 50%; bottom: 45px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 13px 20px;
             border-radius: 999px; font-size: 15px; font-weight: 500; white-space: nowrap; background: rgba(34,36,44,.96); border: 1px solid var(--edge-hi); box-shadow: 0 14px 40px -12px rgba(0,0,0,.7); }
    .toast-act { margin: -6px -10px -6px 0; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.1); font-weight: 600; }
    /* the wall's own keyboard, from design/keyboard/ (C) */
    .kb { position: absolute; left: 0; right: 0; bottom: 0; height: 380px; background: rgba(24,25,31,.97); border-top: 1px solid var(--edge); border-radius: 24px 24px 0 0; }
    .key { position: absolute; height: 62px; border-radius: 12px; background: rgba(255,255,255,.07); display: grid; place-items: center; font-size: 24px; font-weight: 500; color: var(--ink); }
    .comp { display: inline-flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; font-size: 17px; border: 1px solid var(--edge); color: var(--ink-2); white-space: nowrap; }
    .comp.run { background: rgba(var(--lamp-rgb),.12); border-color: rgba(var(--lamp-rgb),.4); color: var(--ink); }
    /* the player card on Your evening: design/player A (Row), chosen 24 September */
    .pcard { position: absolute; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 70px -26px rgba(6,5,28,.76), 0 2px 10px rgba(6,5,28,.34); }
    .pchip { position: absolute; left: 16px; top: 16px; height: 28px; padding: 0 13px; border-radius: 999px; display: flex; align-items: center;
      font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.86); }
    .ppanel { position: absolute; left: 14px; right: 14px; bottom: 14px; border-radius: 22px; padding: 18px 20px 18px; }
    .pline { position: relative; height: 3px; border-radius: 3px; background: rgba(255,255,255,.24); }
    .pline i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: rgba(255,255,255,.95); }
    .pplay { width: 56px; height: 56px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 8px 22px -6px rgba(6,5,28,.6); }
    .rp { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap;
          border: 1px solid rgba(255,255,255,.22); color: rgba(255,255,255,.78); }
    .rp.on { background: rgba(255,255,255,.92); color: #141238; border-color: transparent; }
    /* ANNOTATION, NEVER PANEL: dashed, and in the board's own voice. Nothing inside one is a screen. */
    .note { position: absolute; border: 1px dashed rgba(255,255,255,.26); border-radius: 18px; padding: 12px 16px 11px; background: rgba(8,9,12,.86);
            font-size: 13px; line-height: 1.45; color: var(--ink-2); z-index: 5; }
    .note .cap { display: block; margin-bottom: 8px; }
    .try { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: nowrap; }
    .flip { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px dashed rgba(255,255,255,.24); color: var(--ink-2); cursor: pointer; white-space: nowrap; }
    .flip.on { border-style: solid; border-color: rgba(var(--lamp-rgb),.7); color: var(--lamp); background: rgba(var(--lamp-rgb),.08); }
    .finger { position: absolute; width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.55);
              box-shadow: 0 0 0 10px rgba(255,255,255,.06); z-index: 4; }
  </style>
</helmet>

<!-- B ON A PHONE -- the music card leads Your evening, at the phone's width, with the same row of rooms under it. Play something,
     with nothing playing, opens the same Where-then-What sheet the wall does. -->
<div class="screen phone">

  <div class="abs" style="inset: 0; background: linear-gradient(rgb(17,18,25) 0%, rgb(20,21,30) 45%, rgb(15,16,21) 100%);"></div>
  <div class="abs" style="inset: 0; background: radial-gradient(70% 40% at 10% 40%, rgba(40,46,84,.3), transparent 70%);"></div>
  <div class="abs" style="left: 16px; top: 14px; display: flex; align-items: baseline; gap: 12px;">
    <span style="font-size: 27px; letter-spacing: -.03em; line-height: 28px;">7:40 PM</span><span style="font-size: 15px; color: var(--ink-2);">Friday, October 23</span>
  </div>
  <div class="abs" style="left: 16px; top: 52px; width: 358px; height: 40px; display: flex; align-items: center; gap: 12px;">
    <span class="link"><i></i>Connected</span>
    <span class="gl" style="position: relative; margin-left: auto; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2);"><svg class="i" width="18" height="18" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
    <span class="gl" style="position: relative; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2);"><svg class="i" width="18" height="18" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg></span>
  </div>
  <div class="abs gl" style="left: 16px; top: 102px; width: 358px; height: 54px; border-radius: 999px; display: flex; align-items: center; padding: 5px;">
    <span class="tab on" style="padding: 0 16px; font-size: 16px;"><svg class="i" width="15" height="15" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Your evening</span>
    <span class="tab" style="padding: 0 16px; font-size: 16px;">Rooms</span>
    <span class="tab" style="padding: 0 14px; font-size: 16px;">Cameras</span>
  </div>
  <div class="pcard" style="left: 16px; top: 172px; width: 358px; height: 410px;">
    <div class="abs" style="inset: 0; background: radial-gradient(60% 50% at 70% 30%, rgba(255,214,160,.85), transparent 70%), linear-gradient(150deg,#d08a52 0%,#a5493f 55%,#4a1f2c 100%);"></div>
    <div class="abs" style="inset: 0; background: linear-gradient(180deg, rgba(20,8,10,.04) 0%, rgba(20,8,12,.35) 35%, rgba(12,6,10,.9) 100%);"></div>
    <div class="gl pchip">Living room &middot; Kitchen</div>
    <div class="gl ppanel" style="padding: 16px 18px;">
      <div style="position: relative; display: flex; align-items: center; gap: 12px;">
        <div style="flex: 1; min-width: 0;"><div style="font-size: 18px; font-weight: 600;">Dinner</div><div style="font-size: 13.5px; color: rgba(255,255,255,.66);">Jordan's playlist</div></div>
        <span style="color: rgba(255,255,255,.88);"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5.5h2.2v13H7zM19 5.9v12.2L10.4 12z"/></svg></span><span class="pplay" style="width: 48px; height: 48px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#141238"><rect x="6.4" y="4.5" width="4.2" height="15" rx="1.3"/><rect x="13.4" y="4.5" width="4.2" height="15" rx="1.3"/></svg></span><span style="color: rgba(255,255,255,.88);"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17 5.5h-2.2v13H17zM5 5.9v12.2L13.6 12z"/></svg></span></div>
      <div class="pline" style="margin-top: 14px;"><i style="width: 34%;"></i></div>
      <div style="position: relative; margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px;"><span class="rp on">Living room</span><span class="rp on">Kitchen</span><span class="rp">+ Dining room</span><span class="rp">+ Bedroom</span></div>
    </div>
  </div>
  <div class="tile" style="left: 16px; top: 598px; width: 171px; height: 140px; background-image: var(--sweep), linear-gradient(160deg, #8f6a92, #5d4060);">
    <div class="abs" style="left: 18px; top: 16px; font-size: 44px; font-weight: 300;">71&deg;</div><div class="ts" style="color: rgba(255,255,255,.8);">Heating to 71</div></div>
  <div class="tile" style="left: 203px; top: 598px; width: 171px; height: 140px;"><div class="tn"><svg class="i" width="17" height="17" viewBox="0 0 24 24"><path d="M4 4h16M5 8h14M5 12h14M5 16h14M12 16v4"/></svg>Blinds</div><div class="ts">70% open</div></div>
  <div class="abs gl" style="left: 16px; top: 760px; width: 358px; height: 56px; border-radius: 999px; display: flex; align-items: center; padding: 0 8px 0 60px; color: var(--muted); font-size: 16px;">Tell the house&hellip;
    <span class="abs" style="left: 8px; top: 8px; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8e9cf0, #5a3fb8 45%, #2a1c5c 80%);"></span></div>
</div>
</x-dc>

</body>
</html>
