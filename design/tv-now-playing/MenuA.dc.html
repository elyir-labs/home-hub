<!doctype html><html><head><meta charset="utf-8"><title>A: the record, and a menu from the foot on OK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap"><link rel="stylesheet" href="tv.css"><link rel="stylesheet" href="np.css"></head>
<body><div class="screen"><div class="blur"></div><div class="corner"><div class="c">9:10 PM</div><div class="d">Friday, November 20</div></div>
  <div class="rec"><div class="art"></div><div><div class="t">Slow Evening</div><div class="a">The Larkins</div><div class="bar"><i></i></div></div></div>
  <div class="keys keyline" id="hint0"><span><kbd>OK</kbd>Pause, rooms, more</span></div>
  <div class="sheet">
    <div class="cards">
      <span class="card k" data-f data-f-start data-hint="OK|Pause;▲ ▼|Louder or quieter;Back|Put it away">Pause</span>
      <span class="card k" data-f data-hint="OK|Next song;Back|Put it away">Next</span>
      <span class="card k" data-f data-hint="OK|Play something else;Back|Put it away">Something else</span>
      <span class="vol">Volume <span class="bar"><i></i></span> 35%</span>
    </div>
    <h2>In the living room</h2>
    <div class="cards">
      <span class="card k" data-f data-hint="OK|Turn off;Back|Put it away">Ceiling light <small>On, 35%</small></span>
      <span class="card k" data-f data-hint="OK|Turn off;Back|Put it away">Floor lamp <small>On, 24%</small></span>
      <span class="card k" data-f data-hint="OK|Start Movie;Back|Put it away">Movie <small>scene</small></span>
      <span class="card k" data-f data-hint="OK|Watch on the Apple TV;Back|Put it away">Watch <small>Apple TV</small></span>
      <span class="card k" data-f data-hint="OK|The whole house;Back|Put it away">Other rooms <small>and the house</small></span>
    </div>
    <div class="keys" id="hint"></div>
  </div>
</div>
<script>
  const scr = document.querySelector('.screen')
  window.tvKeys = (key, cur, light) => {
    if (!scr.classList.contains('up') && key === 'Enter') { scr.classList.add('up'); light(document.querySelector('.sheet [data-f-start]')); return true }
    if (scr.classList.contains('up') && (key === 'Escape' || key === 'Backspace')) { scr.classList.remove('up'); return true }
    return !scr.classList.contains('up')
  }
</script><script src="tv.js"></script></body></html>
