<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setting up a pretend hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* design/try-setup/'s boards. ?board=<id>&hub=<port>&off=<port> draws one: the panel itself is an iframe on the mock
   house out of its box (FRESH=1 NET=screen NAMES=plain on `hub`, FRESH=1 NET=setup on `off`, whose engine is still
   waiting, and FRESH=1 on a cable on `on`, ready for Get started), and what each direction adds is drawn here around it, in the /try bar's colors (#f1eee8 on the panel's
   dark), so nothing about the panel itself is invented. app/mock/try-setup-shots.mjs takes the pictures. */
:root { --ground: #0c0d10; --ink: #f1eee8; --quiet: #b9b5ad; --faint: #8f8c85; --line: rgba(255, 255, 255, .1);
  --lamp: #e9b872; --paper: #f1eee8; --paper-ink: #1c1a16; --paper-quiet: #57534b; --font: 'Instrument Sans', system-ui, sans-serif }
* { box-sizing: border-box }
html, body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.45 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased }
.board { position: relative; overflow: hidden }
iframe { border: 0; display: block; background: #10131a }
.fit { position: absolute; transform-origin: 0 0 }

/* the /try bar, grown into a narrator where something happens off the screen (A) */
.bar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--paper); color: var(--paper-ink); z-index: 2 }
.bar b { font-weight: 600; white-space: nowrap }
.bar .say { color: var(--paper-quiet); flex: 1; min-width: 0 }
.bar .say em { font-style: normal; color: var(--paper-ink) }
.bar .act { flex: none; height: 36px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--paper-ink); color: var(--paper); font: 500 15px var(--font); display: inline-flex; align-items: center }
.bar .out { flex: none; color: var(--paper-ink); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 4px }
.bar.wall { height: 60px; font-size: 16px }
.bar.phone { height: auto; min-height: 44px; padding: 10px 14px; font-size: 14.5px; flex-wrap: wrap; gap: 6px 10px }
.bar.phone .say { flex-basis: 100% ; order: 3 }
.bar.phone .act { order: 4; height: 34px }
.bar.phone .out { margin-left: auto; order: 2 }

/* the hub, drawn beside the screen (B) */
.desk { position: absolute; display: grid; align-content: center; justify-items: center; gap: 28px; padding: 32px;
  background: radial-gradient(600px 420px at 50% 42%, rgba(233, 184, 114, .08), transparent 70%), #0a0b0e }
.desk .what { text-align: center; display: grid; gap: 6px; max-width: 320px }
.desk .what b { font-size: 20px; font-weight: 500 }
.desk .what span { color: var(--quiet); font-size: 15px }
.box { position: relative; width: 250px; height: 150px; border-radius: 22px; background: linear-gradient(160deg, #2b2e35, #17191e 70%); box-shadow: 0 30px 60px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08) }
.box .lamp { position: absolute; left: 26px; bottom: 26px; width: 12px; height: 12px; border-radius: 50%; background: #3a3d44 }
.box.on .lamp { background: var(--lamp); box-shadow: 0 0 18px 4px rgba(233, 184, 114, .55) }
.box .mark { position: absolute; right: 24px; bottom: 20px; opacity: .55 }
.cable { position: absolute; right: -150px; top: 70px; width: 150px; height: 10px; border-radius: 5px; background: #222; }
.box:not(.on) .cable { right: -190px; transform: rotate(-8deg); transform-origin: right center }
.plug { position: absolute; right: -196px; top: 62px; width: 34px; height: 26px; border-radius: 6px; background: #2a2a2a }
.box:not(.on) .plug { right: -230px; top: 40px }
.label { width: 280px; border-radius: 14px; background: var(--paper); color: var(--paper-ink); padding: 14px 16px; display: grid; grid-template-columns: 1fr 64px; gap: 4px 12px; font-size: 13.5px; box-shadow: 0 16px 34px rgba(0, 0, 0, .45) }
.label .t { grid-column: 1 / -1; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--paper-quiet) }
.label .k { color: var(--paper-quiet) }
.label .v { font-weight: 600; margin-bottom: 4px }
.label .qr { grid-column: 2; grid-row: 2 / span 4; width: 64px; height: 64px; background:
  conic-gradient(from 90deg at 30% 30%, #1c1a16 25%, transparent 0) 0 0 / 16px 16px, #fff; border-radius: 6px; outline: 4px solid #fff }
.label.lit { outline: 3px solid var(--lamp); outline-offset: 4px }
.press { height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--paper); color: var(--paper-ink); font: 500 16px var(--font) }
.dark-screen { position: absolute; background: #050608; display: grid; place-items: center; color: var(--faint); font-size: 15px; border-radius: 0 }

/* the one card before the questions (C) */
.veil { position: absolute; inset: 0; background: rgba(6, 8, 12, .55); display: grid; place-items: center; z-index: 2 }
.card { width: min(560px, calc(100% - 32px)); border-radius: 24px; background: var(--paper); color: var(--paper-ink); padding: 30px 30px 26px; display: grid; gap: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5) }
.card .t { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8a5f1f; font-weight: 600 }
.card h1 { margin: 0; font-size: 32px; line-height: 1.1; font-weight: 500; letter-spacing: -.02em }
.card p { margin: 0; color: var(--paper-quiet); font-size: 16.5px }
.card ol { margin: 0; padding: 0 0 0 20px; color: var(--paper-quiet); font-size: 15.5px; display: grid; gap: 4px }
.card .go { justify-self: start; display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 999px; border: 0; background: var(--paper-ink); color: var(--paper); font: 500 16px var(--font); margin-top: 6px }
.card.small { padding: 22px; gap: 10px }
.card.small h1 { font-size: 24px }
.card.small p { font-size: 15px }
.corner { position: absolute; z-index: 2 }

/* the way in, on the site (every direction) */
.site { position: absolute; inset: 0; padding: 64px 56px; display: grid; grid-template-columns: 480px 1fr; gap: 56px; align-items: center;
  background: radial-gradient(1100px 560px at 75% 12%, rgba(233, 184, 114, .10), transparent 62%), var(--ground) }
.site .label2 { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--lamp) }
.site h2 { font-size: 42px; line-height: 1.08; font-weight: 500; letter-spacing: -.025em; margin: 12px 0 18px }
.site p { color: var(--quiet); font-size: 18px; margin: 0 0 22px }
.site .doors { display: flex; gap: 12px; flex-wrap: wrap }
.site .pill { height: 48px; padding: 0 22px; border-radius: 999px; display: inline-flex; align-items: center; font-weight: 500; border: 1px solid var(--line); color: var(--ink) }
.site .pill.lamp { background: var(--lamp); color: #2a1c07; border-color: transparent }
.site .frame { background: #030405; border: 1px solid rgba(255, 255, 255, .09); border-radius: 22px; padding: 12px; box-shadow: 0 40px 90px rgba(0, 0, 0, .55); overflow: hidden }
.new { outline: 2px dashed rgba(233, 184, 114, .7); outline-offset: 6px; border-radius: 999px }
</style>
</head>
<body>
<div id="out"></div>
<script>
const q = new URLSearchParams(location.search)
const HUB = `http://localhost:${q.get('hub')}`, OFF = `http://localhost:${q.get('off')}`, ON = `http://localhost:${q.get('on')}`, SITE = q.get('site') ? `http://localhost:${q.get('site')}` : ''
const back = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>'
const markSvg = '<svg width="26" height="26" viewBox="84 92 344 336"><path d="M112 248 256 120l144 128" fill="none" stroke="#f1eee8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M148 226v170h216V226" fill="none" stroke="#f1eee8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><circle cx="256" cy="306" r="32" fill="#e9b872"/></svg>'

/* the panel at its own size, scaled into a box */
function panel(src, x, y, w, h, scale = 1) {
  return `<div class="fit" style="left:${x}px;top:${y}px;width:${w * scale}px;height:${h * scale}px;overflow:hidden">
    <iframe src="${src}" width="${w}" height="${h}" style="transform:scale(${scale});transform-origin:0 0"></iframe></div>`
}
const wall = (inner) => `<div class="board" style="width:1440px;height:900px">${inner}</div>`
const phone = (inner) => `<div class="board" style="width:390px;height:844px">${inner}</div>`

/* A -- the /try bar, which says what a real hub would be doing only where it is doing it off the screen */
const bar = (cls, say, act) => `<div class="bar ${cls}"><b>A pretend hub</b><span class="say">${say}</span>${act ? `<span class="act">${act}</span>` : ''}<a class="out">${back}Leave</a></div>`
const label = (lit) => `<div class="label${lit ? ' lit' : ''}"><span class="t">On the bottom of the hub</span><span class="k">Its Wi‑Fi</span><span class="qr"></span><span class="v">Elyir Hub 4F2A</span><span class="k">Password</span><span class="v">kite-maple-41</span></div>`

/* B -- the hub on a desk beside the screen, to be plugged in and read */
const desk = (on, what, extra = '') => `<div class="box${on ? ' on' : ''}"><span class="lamp"></span><span class="mark">${markSvg}</span><span class="cable"></span><span class="plug"></span></div>
  <div class="what">${what}</div>${extra}`

const BOARDS = {
  /* every direction: a second way in, beside Start the pretend house */
  'way-in': () => wall(`<div class="site">
      <div><div class="label2">Try it</div><h2>A pretend house, right here</h2>
        <p>A whole house that isn't real. Tap the lights, run Bedtime, type <i>kitchen lights off</i>.</p>
        <div class="doors"><span class="pill lamp">Start the pretend house</span><span class="pill new">Set one up from the box</span></div></div>
      <div class="frame" style="position:relative;width:830px;height:526px">${panel(`${HUB}/?setup=1&page=owner`, 12, 12, 1440, 900, 0.56)}</div></div>`),

  'a-ready': () => wall(bar('wall', 'A real hub downloads the rest of itself the first time, which takes a few minutes. <em>This one takes a moment.</em>')
    + panel(`${OFF}/`, 0, 60, 1440, 840)),
  'a-wifi': () => wall(bar('wall', 'On a real hub this is your own Wi‑Fi. <em>Here, any password joins.</em>')
    + panel(`${HUB}/`, 0, 60, 1440, 840)),
  'a-add': () => wall(bar('wall', 'A new bulb joins when you switch it on, or press its button.', 'Switch one on')
    + panel(`${HUB}/?setup=1&page=devices`, 0, 60, 1440, 840)),
  'a-phone': () => phone(bar('phone', 'A new bulb joins when you switch it on, or press its button.', 'Switch one on')
    + panel(`${HUB}/?setup=1&page=devices`, 0, 124, 390, 720)),

  'b-plug': () => wall(`<div class="desk" style="left:0;top:0;width:460px;height:900px">${desk(false, '<b>Plug it in</b><span>The hub starts when it has power. Its screen comes on by itself.</span>', '<button class="press">Plug it in</button>')}</div>
    <div class="dark-screen" style="left:460px;top:120px;width:980px;height:612px">The screen beside the hub, off</div>`),
  'b-wifi': () => wall(`<div class="desk" style="left:0;top:0;width:460px;height:900px">${desk(true, '<b>Its own Wi‑Fi is on the bottom</b><span>A phone can join the hub with it, or the screen asks which is yours.</span>', label(true))}</div>
    ${panel(`${HUB}/`, 460, 120, 1440, 900, 0.68)}`),
  'b-phone': () => phone(`<div class="desk" style="left:0;top:0;width:390px;height:250px;padding:18px;gap:12px;grid-template-columns:auto 1fr;align-content:center;justify-items:start">
      <div style="transform:scale(.46);transform-origin:left center;width:120px;height:70px">${desk(true, '').replace('<div class="what"></div>', '')}</div>
      <div class="what" style="text-align:left"><b style="font-size:17px">Plugged in</b><span style="font-size:14px">Its Wi‑Fi: Elyir Hub 4F2A · kite-maple-41</span></div></div>
    ${panel(`${HUB}/?setup=1&page=owner`, 0, 250, 390, 844, 594 / 844)}`),

  'c-start': () => wall(panel(`${ON}/`, 0, 0, 1440, 900) + `<div class="veil"><div class="card">
      <span class="t">A pretend hub</span><h1>It’s plugged in and on your Wi‑Fi.</h1>
      <p>That part happens off the screen, so it’s done. What’s left is what the hub asks the people who live with it:</p>
      <ol><li>your name, and one for the house</li><li>a passcode</li><li>where home is, and which rooms</li><li>what’s in the house</li></ol>
      <span class="go">Start</span></div></div>`),
  'c-done': () => wall(panel(`${HUB}/?setup=1&page=done`, 0, 0, 1440, 900) + `<div class="corner" style="right:32px;bottom:32px"><div class="card small" style="width:380px">
      <span class="t">A pretend hub</span><h1>That’s all a real one asks.</h1>
      <p>Next it opens on the house: this one is empty until you add the things it found. Leaving forgets it.</p></div></div>`),
  'c-phone': () => phone(panel(`${ON}/`, 0, 0, 390, 844) + `<div class="veil" style="align-items:end;padding-bottom:16px"><div class="card small">
      <span class="t">A pretend hub</span><h1>It’s plugged in and on your Wi‑Fi.</h1>
      <p>That part happens off the screen. What’s left is four questions, then the house.</p><span class="go">Start</span></div></div>`),
}
const id = q.get('board')
document.getElementById('out').innerHTML = BOARDS[id] ? BOARDS[id]() : `no board ${id}`
</script>
</body>
</html>
