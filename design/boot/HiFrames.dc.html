<!doctype html>
<html>
<head><meta charset="utf-8"><title>Hi, side by side</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="boot.css">
<style>
  /* The four startups held at the same seconds, so they can be compared without watching four
     loops at once. Each thumbnail is the full 1440x900 board at a fifth of its size. */
  html, body { width: 2560px; height: 1300px; background: #15161a; }
  body { padding: 44px 40px; box-sizing: border-box; color: #f1eee8; }
  h1 { margin: 0 0 6px; font-size: 30px; font-weight: 500; }
  .sub { margin: 0 0 34px; color: #9a968e; font-size: 17px; }
  .grid { display: grid; grid-template-columns: 200px repeat(7, 300px); gap: 20px 20px; align-items: start; }
  .head { font-size: 15px; color: #b9b5ad; line-height: 1.3; }
  .head b { display: block; color: #f1eee8; font: 600 17px ui-monospace, Menlo, monospace; margin-bottom: 3px; }
  .row { font-size: 20px; font-weight: 500; padding-top: 6px; }
  .row span { display: block; margin-top: 6px; font-size: 14px; font-weight: 400; color: #9a968e; line-height: 1.35; }
  .thumb { width: 300px; height: 187.5px; overflow: hidden; border-radius: 6px; outline: 1px solid #2c2e34; position: relative; }
  .thumb .wall { transform: scale(.208333); transform-origin: 0 0; }
</style>
</head>
<body>
<h1>Hi, five ways</h1>
<p class="sub">Hi comes up with the first frame the screen draws, holds for three and a half seconds, and gives way to the house, which waits with its lamp breathing until the house is ready.</p>
<div class="grid" id="g"></div>
<script src="boot.js"></script>
<script>
  const cols = [
    [4.5, '0:04', 'The screen first lights'],
    [5.3, '0:05', 'Hi arrives'],
    [6.6, '0:06', 'Hi holds'],
    [7.9, '0:07', 'Hi gives way'],
    [9.0, '0:09', 'The light moves'],
    [30, '0:30', 'The house waits'],
    [77, '1:17', 'The panel'],
  ]
  const rows = [
    ['G', 'G \u00b7 In a warm light', 'Comes into focus with a light drifting behind it'],
    ['H', 'H \u00b7 Written by hand', 'One stroke, the way a person writes it'],
    ['I', 'I \u00b7 The dot is the lamp', 'The i is dotted with the house\u2019s light, which stays'],
    ['J', 'J \u00b7 elyir, the dot into the house', 'Written by hand; the dot lights and becomes the hub\u2019s lamp'],
    ['K', 'K \u00b7 elyir, the light on its own', 'The same, but the light stays alone: one ending for every product'],
  ]
  const g = document.getElementById('g')
  const cell = (html, cls) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; g.appendChild(d); return d }
  cell('', 'head')
  cols.forEach(([, at, what]) => cell(`<b>${at}</b>${what}`, 'head'))
  rows.forEach(([dir, name, why]) => {
    cell(`${name}<span>${why}</span>`, 'row')
    cols.forEach(([t]) => {
      const th = cell('', 'thumb')
      const w = document.createElement('div'); w.className = 'wall'; w.dataset.dir = dir; w.dataset.t = t
      th.appendChild(w); Boot.mount(w)
    })
  })
</script>
</body>
</html>
