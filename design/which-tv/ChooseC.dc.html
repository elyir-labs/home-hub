<!doctype html>
<html>
<head><meta charset="utf-8"><title>C: the household chooses which screens show photos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="which.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>7:40 PM</span><span class="r"><i style="height: 5px"></i><i style="height: 7px"></i><i style="height: 9px"></i><i style="height: 11px"></i></span></div>
  <div class="col" style="top: 62px;">
    <div class="back"><svg class="i" width="18" height="18" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>This house</div>
    <h1>Photos</h1>
    <p class="lede">The screens you choose show these when nobody is watching them. They stay on the hub, in this house, and nowhere else.</p>
    <div class="cta"><svg class="i" width="20" height="20" viewBox="0 0 24 24" style="margin-right:8px"><path d="M12 5v14M5 12h14"/></svg>Add photos</div>
    <div class="who"><b>Shown on</b><span>a TV starts on</span></div>
    <div class="screenrow"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg><div class="t"><b>Living room TV</b><span>Plugged into the hub</span></div><span class="switch on"></span></div>
    <div class="screenrow"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M10 18h4"/></svg><div class="t"><b>Hallway</b><span>A screen on the wall · shows the clock</span></div><span class="switch"></span></div>
    <div class="who"><b>3 photos</b><span>from 2 phones</span></div><div class="grid"><i class="p1"></i><i class="p2"></i><i class="p3"></i></div>
  </div>
  <div class="home-ind"></div>
</div>
</body>
</html>
