<!doctype html>
<html>
<head><meta charset="utf-8"><title>B: the resting TV shows the record</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="tv.css"><link rel="stylesheet" href="music.css">
<style>
  .glow { position: absolute; inset: 0; background: radial-gradient(50% 60% at 30% 50%, rgba(232,164,106,.22), transparent 70%), radial-gradient(40% 50% at 80% 70%, rgba(60,90,140,.25), transparent 70%); }
  .rec { position: absolute; left: 240px; top: 240px; display: flex; gap: 70px; align-items: center; z-index: 2; }
  .rec .art { width: 560px; height: 560px; border-radius: 28px; box-shadow: 0 40px 100px rgba(0,0,0,.6); }
  .rec .t { font-size: 84px; font-weight: 400; letter-spacing: -.03em; line-height: 1.02; }
  .rec .a { font-size: 34px; color: var(--ink-2); margin-top: 18px; }
  .rec .w { font-size: 26px; color: var(--muted); margin-top: 40px; }
  .rec .pbar { width: 560px; margin-top: 40px; }
  .corner { position: absolute; right: var(--safe-x); top: var(--safe-y); text-align: right; z-index: 2; }
  .corner .c { font-size: 56px; font-weight: 300; } .corner .d { font-size: 22px; color: var(--ink-2); }
  .band { position: absolute; left: var(--safe-x); right: var(--safe-x); bottom: var(--safe-y); height: 130px; z-index: 4; display: none; align-items: center; gap: 24px;
          padding: 0 24px; border-radius: var(--r-lg); background: rgba(14,16,20,.92); border: 1px solid var(--edge-hi); }
  .band .b { height: 84px; padding: 0 30px; display: inline-flex; align-items: center; gap: 12px; font-size: 26px; }
  .band .vol { flex: 1; display: flex; align-items: center; gap: 16px; font-size: 24px; color: var(--ink-2); justify-content: flex-end; }
  .band .vol .pbar { width: 300px; }
  .screen.up .band { display: flex; } .screen.up .hintrest { display: none; }
  .hintrest { position: absolute; right: var(--safe-x); bottom: var(--safe-y); z-index: 3; }
</style>
</head>
<body>
<div class="screen">
  <div class="glow"></div>
  <div class="corner"><div class="c">9:10 PM</div><div class="d">Friday, November 20 · 78°</div></div>
  <div class="rec"><div class="art"></div>
    <div><div class="t">Slow Evening</div><div class="a">The Larkins · Low Light</div><div class="w">On the Left and Right Pod, in the living room</div><div class="pbar"><i></i></div></div></div>
  <div class="keys hintrest"><span><kbd>OK</kbd>Pause, next, louder</span></div>
  <div class="band">
    <span class="card b" data-f data-f-start data-hint="OK|Pause;▲ ▼|Volume;Back|Put it away">Pause</span>
    <span class="card b" data-f data-hint="OK|Next song;Back|Put it away">Next</span>
    <span class="card b" data-f data-hint="OK|The whole room;Back|Put it away">The living room</span>
    <span class="vol">Volume<span class="pbar"><i style="width:35%"></i></span>35%</span>
  </div>
</div>
<script>
  // a resting TV: OK raises the band (the living room's OverC), Back puts it away
  const scr = document.querySelector('.screen')
  window.tvKeys = (key, cur, light) => {
    if (!scr.classList.contains('up') && key === 'Enter') { scr.classList.add('up'); light(document.querySelector('.band [data-f-start]')); return true }
    if (scr.classList.contains('up') && (key === 'Escape' || key === 'Backspace')) { scr.classList.remove('up'); return true }
    return false
  }
</script>
<script src="tv.js"></script>
</body>
</html>
