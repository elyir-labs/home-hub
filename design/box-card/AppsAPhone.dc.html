<!doctype html>
<html>
<head><meta charset="utf-8"><title>A on the phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="card.css">
</head>
<body>
<!-- the room is the shipped panel on the pretend house at 20:10 (?room=living), its TV asleep; only the TV card is drawn -->
<div class="shot phone">
  <img src="phone-asleep.jpg" alt="">
  <div class="box">
    <div><div class="kick">Apple TV</div><div class="nm">Asleep</div></div>
    <div class="chips"><span class="chip" data-app="Disney+" style="--t:60, 120, 90">Disney+</span><span class="chip" data-app="Netflix" style="--t:150, 45, 50">Netflix</span><span class="chip more" data-pane>More</span></div>
  </div>
  <div class="pane"></div>
  <div class="try">Tap an app</div>
</div>
<script src="card.js"></script>
</body>
</html>
