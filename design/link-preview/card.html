<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The front page's link preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* What a shared hub.elyir.com link turns into in somebody else's app. ?board=<id> draws one board, which is how each
   .dc.html shows it: on the left the picture itself at 1200x630 (drawn at 60%) and the same link unfurled in a chat
   app on a computer; on the right the link in Messages on a phone, where the picture is about 260 points wide.
   The card is drawn in the site's own light colors (site/index.html); a link preview cannot follow the reader's
   light or dark, so it has to pick one. The pictures are site/shots/ as they are live. */
:root {
  --ground: #f4f2ee; --surface: #ffffff; --line: rgba(28, 26, 22, .12); --ink: #1c1a16; --quiet: #57534b;
  --faint: #6f6b62; --lamp: #e9b872; --lamp-text: #8a5f1f; --bezel: #16181d;
  --font: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --apple: -apple-system, 'SF Pro Text', system-ui, sans-serif;
}
* { box-sizing: border-box }
html, body { margin: 0; width: 1440px; height: 900px; overflow: hidden; background: #e7e5e1; color: #1d1d1f }
body { font: 15px/1.45 var(--apple); -webkit-font-smoothing: antialiased; display: grid; grid-template-columns: 900px 1fr; gap: 56px; padding: 56px 64px }
p { margin: 0 }
.tag { font: 600 12px var(--apple); letter-spacing: .12em; text-transform: uppercase; color: #6e6e73; margin-bottom: 12px }

.frame { width: 720px; height: 378px; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 18px 40px rgba(0,0,0,.12); background: #fff }
.frame .card { transform: scale(.6); transform-origin: 0 0 }
.none { width: 720px; height: 378px; border-radius: 10px; border: 2px dashed #b9b6b0; display: grid; place-items: center; text-align: center; color: #6e6e73; font-size: 17px; padding: 40px }

/* the chat app on a computer: a bar, a title, the description, and the picture under it */
.chat { margin-top: 28px; background: #fff; border-radius: 10px; padding: 18px 22px; box-shadow: 0 1px 0 rgba(0,0,0,.05) }
.who { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 15px }
.who i { width: 34px; height: 34px; border-radius: 8px; background: #7a8b74; display: block }
.who small { font-weight: 400; color: #6e6e73; font-size: 12px }
.msg { margin: 4px 0 0 44px }
.msg a { color: #1264a3; text-decoration: none }
.unfurl { margin: 8px 0 0 44px; border-left: 4px solid #dddcd8; padding: 2px 0 2px 12px; max-width: 520px }
.unfurl .site { display: flex; gap: 6px; align-items: center; font-weight: 700; font-size: 13px }
.unfurl .t { color: #1264a3; font-weight: 700; margin-top: 2px }
.unfurl .d { color: #1d1d1f; font-size: 14px; margin-top: 2px }
.unfurl .thumb { margin-top: 8px; width: 300px; height: 157.5px; border-radius: 8px; overflow: hidden }
.unfurl .thumb .card { transform: scale(.25); transform-origin: 0 0 }

/* Messages on a phone */
.phone { width: 360px; height: 760px; background: #fff; border-radius: 48px; border: 10px solid #1d1d1f; overflow: hidden; display: flex; flex-direction: column; justify-self: start }
.bar { height: 92px; border-bottom: 1px solid #e5e5ea; display: grid; place-items: end center; padding-bottom: 10px; font-size: 12px; color: #1d1d1f; background: #f9f9f9 }
.bar b { display: block; text-align: center; font-weight: 500 }
.bar i { display: block; width: 44px; height: 44px; border-radius: 50%; background: #c7c7cc; margin: 0 auto 4px }
.thread { flex: 1; padding: 18px 14px; display: flex; flex-direction: column; gap: 6px; justify-content: flex-end }
.out { align-self: flex-end; background: #0a84ff; color: #fff; border-radius: 18px; padding: 8px 13px; max-width: 250px; font-size: 16px }
.in { align-self: flex-start; background: #e9e9eb; border-radius: 18px; padding: 8px 13px; max-width: 250px; font-size: 16px }
.link { align-self: flex-end; width: 262px; border-radius: 18px; overflow: hidden; background: #e9e9eb }
.link .pic { width: 262px; height: 137.5px; overflow: hidden }
.link .pic .card { transform: scale(.21833); transform-origin: 0 0 }
.link .words { padding: 8px 13px 10px; font-size: 14px; line-height: 1.3 }
.link .words b { display: block; font-weight: 600 }
.link .words span { color: #6e6e73; font-size: 13px }
.link.small { display: grid; grid-template-columns: 1fr 44px; align-items: center; gap: 10px; padding: 10px 12px }
.link.small .words { padding: 0 }
.link.small svg { background: #fff; border-radius: 9px; padding: 6px }
.typing { height: 76px; border-top: 1px solid #e5e5ea; display: flex; align-items: center; padding: 0 14px }
.typing span { flex: 1; height: 36px; border: 1px solid #d1d1d6; border-radius: 18px }

/* THE CARD, at its real size, 1200x630, in the site's own face and colors */
.card { width: 1200px; height: 630px; position: relative; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font);
  background-image: radial-gradient(900px 460px at 78% 18%, rgba(233, 184, 114, .22), transparent 62%) }
.card .name { position: absolute; display: flex; align-items: center; gap: 16px; font-weight: 500; font-size: 34px; letter-spacing: -.01em }
.card h2 { position: absolute; margin: 0; font-weight: 500; letter-spacing: -.025em; line-height: 1.02 }
.card .wall { position: absolute; background: var(--bezel); border-radius: 26px; padding: 14px; box-shadow: 0 30px 70px rgba(28, 24, 16, .28) }
.card .wall img { display: block; width: 100%; border-radius: 12px }
.card .ph { position: absolute; background: var(--bezel); border-radius: 44px; padding: 10px; overflow: hidden; box-shadow: 0 30px 70px rgba(28, 24, 16, .3) }
.card .ph img { display: block; width: 100%; border-radius: 34px }
.card .when { position: absolute; font-size: 24px; color: var(--quiet) }
</style>
</head>
<body>
<div class="left"></div>
<div class="right"></div>
<script>
const mark = (s = 40) => `<svg width="${s}" height="${s}" viewBox="84 92 344 336" aria-hidden="true"><path d="M112 248 256 120l144 128" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M148 226v170h216V226" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><circle cx="256" cy="306" r="32" fill="#e9b872"/></svg>`
const TITLE = 'Elyir Home Hub'
const DESC = 'Your house on one screen: lights, locks, cameras and the thermostat, on a screen on the wall and every phone in the house. Set up by answering a few questions. Free and open source.'

const CARDS = {
  /* A: the front page's own top, made to fit: the name, the line, and the living room on both screens */
  a: () => `<div class="card">
    <div class="name" style="left:64px;top:60px">${mark(44)}${TITLE}</div>
    <h2 style="left:64px;top:170px;width:420px;font-size:68px">Your house, on one screen.</h2>
    <div class="wall" style="left:480px;top:70px;width:780px"><img src="shots/wall-room-light.jpg" alt=""></div>
    <div class="ph" style="left:396px;top:300px;width:190px;height:390px"><img src="shots/phone-room-light.jpg" alt=""></div>
  </div>`,
  /* B: the wall alone, nearly edge to edge, and no words: the app already prints the title under it */
  b: () => `<div class="card">
    <div class="wall" style="left:50%;top:38px;width:900px;transform:translateX(-50%)"><img src="shots/wall-room-light.jpg" alt=""></div>
  </div>`,
  /* C: the name over the wall through a day */
  c: () => `<div class="card">
    <div class="name" style="left:64px;top:62px">${mark(44)}${TITLE}</div>
    <h2 style="left:64px;top:140px;font-size:56px">It changes with the sky outside.</h2>
    ${[['wall-morning-light', 'Morning'], ['wall-afternoon-light', 'Afternoon'], ['wall-evening-light', 'Evening']].map(([f, w], i) =>
      `<div class="wall" style="left:${64 + i * 362}px;top:280px;width:346px;padding:8px;border-radius:16px"><img src="shots/${f}.jpg" alt="" style="border-radius:8px"></div>
       <p class="when" style="left:${64 + i * 362}px;top:530px">${w}</p>`).join('')}
  </div>`,
}

const id = new URLSearchParams(location.search).get('board') || 'today'
const card = CARDS[id]
const left = document.querySelector('.left'), right = document.querySelector('.right')

left.innerHTML = `<p class="tag">${card ? 'The picture · 1200 × 630, here at 60%' : 'The picture · none: the page names none'}</p>
  ${card ? `<div class="frame">${card()}</div>` : `<div class="none">No picture. A chat app shows the title and the description;<br>Messages shows the page's little house and its title.</div>`}
  <div class="chat">
    <div class="who"><i></i>Sam <small>10:14 AM</small></div>
    <p class="msg">this is the thing I was telling you about <a>https://hub.elyir.com</a></p>
    <div class="unfurl">
      <div class="site">${mark(16)}hub.elyir.com</div>
      <p class="t">${TITLE}</p>
      <p class="d">${DESC}</p>
      ${card ? `<div class="thumb">${card()}</div>` : ''}
    </div>
  </div>`

right.innerHTML = `<p class="tag">In Messages, on a phone</p>
  <div class="phone">
    <div class="bar"><div><i></i><b>Alex</b></div></div>
    <div class="thread">
      <p class="in">What did you end up getting for the lights?</p>
      ${card
        ? `<div class="link"><div class="pic">${card()}</div><div class="words"><b>${TITLE}</b><span>hub.elyir.com</span></div></div>`
        : `<div class="link small"><div class="words"><b>${TITLE}</b><span>hub.elyir.com</span></div>${mark(32)}</div>`}
      <p class="out">This. Try the pretend house, it's the real thing</p>
    </div>
    <div class="typing"><span></span></div>
  </div>`
</script>
</body>
</html>
