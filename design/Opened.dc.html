<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: "Instrument Sans", -apple-system, "SF Pro Text", system-ui, sans-serif; }
    a { color: #e9b872; } a:hover { color: #b8863e; }
    .dsp { /* the titles, in the face the board is already in -- see app/src/panel.css */
           font-family: inherit; font-weight: 400; letter-spacing: -.025em; }
  </style>
</helmet>

<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0c0d10; color: #f1eee8; font-size: 17px; line-height: 1.4;">

  <!-- field, warmed by what is open: the lamp's own color bleeds into the room -->
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgb(10,14,34) 0%, rgb(38,34,74) 44%, rgb(158,84,60) 80%, rgb(96,54,44) 100%);"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(90% 70% at 62% 74%, rgba(233,184,114,.30), transparent 66%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,13,16,.34) 0%, rgba(12,13,16,.50) 45%, rgba(12,13,16,.72) 100%);"></div>

  <!-- the home, pushed back: scaled down, blurred, dimmed -->
  <div style="position: absolute; inset: 0; transform: scale(.955); transform-origin: 50% 42%; filter: blur(13px) brightness(.52) saturate(.85);">
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 84px; display: flex; align-items: center; gap: 24px; padding: 0 40px;">
      <div style="flex: 1 1 0; font-size: 16px;">Thu, September 10</div>
      <div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(26,28,34,.55);">
        <div style="padding: 0 22px; height: 44px; display: grid; place-items: center; border-radius: 999px; background: rgba(255,255,255,.10); font-size: 15.5px;">Your evening</div>
        <div style="padding: 0 22px; height: 44px; display: grid; place-items: center; font-size: 15.5px; color: #b9b5ad;">Rooms</div>
        <div style="padding: 0 22px; height: 44px; display: grid; place-items: center; font-size: 15.5px; color: #b9b5ad;">Cameras</div>
      </div>
      <div style="flex: 1 1 0; display: flex; justify-content: flex-end;"><div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(140deg, #8a7f6a, #4a4238);"></div></div>
    </div>
    <h1 class="dsp" style="position: absolute; top: 104px; left: 40px; margin: 0; font-size: 52px; line-height: 1.02;">Good evening</h1>
    <p style="position: absolute; top: 168px; left: 40px; margin: 0; font-size: 18px; color: #b9b5ad;">Four lights on, the back door unlocked.</p>
    <div style="position: absolute; top: 106px; right: 40px; display: flex; align-items: center; gap: 16px;">
      <svg width="156" height="112" viewBox="0 0 210 150" style="margin: -22px -6px -18px 0;">
        <defs><radialGradient id="cl2" cx="34%" cy="28%" r="78%"><stop offset="0" stop-color="#ffffff" stop-opacity=".97"/><stop offset="62%" stop-color="#d8dce6" stop-opacity=".92"/><stop offset="100%" stop-color="#9aa3b4" stop-opacity=".82"/></radialGradient></defs>
        <g fill="url(#cl2)"><ellipse cx="72" cy="86" rx="56" ry="40"/><ellipse cx="118" cy="70" rx="48" ry="44"/><ellipse cx="150" cy="94" rx="42" ry="30"/><rect x="60" y="92" width="104" height="34" rx="17"/></g>
      </svg>
      <div><div class="dsp" style="font-size: 46px; line-height: 1;">17&deg;</div><div style="margin-top: 6px; font-size: 15px; color: #b9b5ad;">Clear and cooling</div></div>
    </div>
    <div style="position: absolute; top: 236px; left: 40px; right: 0; display: flex; align-items: center; gap: 18px;">
      <div style="flex: 0 0 auto; width: 372px; height: 340px; border-radius: 26px; background: radial-gradient(120% 90% at 22% 12%, oklch(0.62 0.09 330 / .85), oklch(0.24 0.03 330 / .9) 62%);"></div>
      <div style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 18px;">
        <div style="width: 248px; height: 196px; border-radius: 26px; background: linear-gradient(155deg, oklch(0.408 0.042 92), oklch(0.353 0.042 98));"></div>
        <div style="width: 248px; height: 196px; border-radius: 26px; background: linear-gradient(155deg, oklch(0.408 0.042 44), oklch(0.353 0.042 50));"></div>
      </div>
      <div style="flex: 0 0 auto; width: 320px; height: 340px; border-radius: 26px; background: linear-gradient(155deg, oklch(0.408 0.042 76), oklch(0.353 0.042 82));"></div>
      <div style="flex: 0 0 auto; width: 300px; height: 340px; border-radius: 26px; background: linear-gradient(155deg, oklch(0.408 0.042 30), oklch(0.353 0.042 36));"></div>
      <div style="flex: 0 0 auto; width: 248px; height: 340px; border-radius: 26px; background: linear-gradient(155deg, oklch(0.408 0.042 66), oklch(0.353 0.042 72));"></div>
    </div>
  </div>

  <!-- the opened device, risen into place -->
  <div style="position: absolute; left: 0; right: 0; top: 196px; bottom: 0; border-radius: 34px 34px 0 0; overflow: hidden; border: 1px solid rgba(255,255,255,.12); border-bottom: 0; background: linear-gradient(180deg, oklch(0.30 0.05 300 / .78), oklch(0.20 0.04 290 / .90)); backdrop-filter: blur(30px) saturate(1.25);">
    <div style="position: absolute; inset: 0; background: radial-gradient(85% 88% at 70% 96%, rgba(233,184,114,.34), transparent 62%);"></div>

    <!-- the lamp itself, carried further right than the panel traveled -->
    <svg width="760" height="620" viewBox="0 0 760 620" style="position: absolute; right: 24px; bottom: 0;">
      <defs>
        <radialGradient id="pool" cx="50%" cy="30%" r="62%"><stop offset="0" stop-color="#f6dcae" stop-opacity=".72"/><stop offset="55%" stop-color="#e9b872" stop-opacity=".26"/><stop offset="100%" stop-color="#e9b872" stop-opacity="0"/></radialGradient>
        <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e6c6"/><stop offset="100%" stop-color="#e0b981"/></linearGradient>
        <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5c5750"/><stop offset="45%" stop-color="#b3aa9c"/><stop offset="100%" stop-color="#4a4640"/></linearGradient>
      </defs>
      <ellipse cx="392" cy="470" rx="330" ry="150" fill="url(#pool)"/>
      <rect x="386" y="170" width="12" height="376" rx="6" fill="url(#stem)"/>
      <path d="M300 168h184l-30-96H330z" fill="url(#shade)"/>
      <ellipse cx="392" cy="168" rx="92" ry="17" fill="#fbeed6" opacity=".92"/>
      <ellipse cx="392" cy="176" rx="70" ry="12" fill="#f6dcae" opacity=".55"/>
      <ellipse cx="392" cy="548" rx="86" ry="20" fill="#4a4640"/>
      <ellipse cx="392" cy="542" rx="86" ry="20" fill="#6e685f"/>
    </svg>

    <!-- close -->
    <div style="position: absolute; top: 30px; right: 36px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #b9b5ad; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.10);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>

    <div style="position: absolute; top: 44px; left: 56px; right: 620px;">
      <div style="font-size: 15px; letter-spacing: .02em; color: #b9b5ad;">Living room</div>
      <h2 class="dsp" style="margin: 4px 0 0; font-size: 56px; line-height: 1.04;">Floor lamp</h2>

      <div style="display: flex; gap: 12px; margin-top: 26px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: #e9b872; color: #2a1c07;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v8.5M6.6 6.6a7.6 7.6 0 1 0 10.8 0"/></svg>
        </div>
        <div style="width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.10); color: #b9b5ad;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
        </div>
        <div style="width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.10); color: #b9b5ad;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5a8.5 8.5 0 1 0 0-17 8.5 8.5 0 0 0 0 17zM12 7.5v5l3 2"/></svg>
        </div>
      </div>

      <div class="dsp" style="margin-top: 54px; font-size: 76px; line-height: 1; letter-spacing: -0.02em;">28<span style="font-size: 34px; vertical-align: top; line-height: 1.9;">%</span></div>

      <div style="display: flex; gap: 30px; margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.12);">
        <div><div style="font-size: 20px; font-weight: 500;">2700K</div><div style="margin-top: 2px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #7f7d77;">Warm white</div></div>
        <div><div style="font-size: 20px; font-weight: 500;">6W</div><div style="margin-top: 2px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #7f7d77;">Drawing</div></div>
        <div><div style="font-size: 20px; font-weight: 500;">Hue</div><div style="margin-top: 2px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #7f7d77;">Over Zigbee</div></div>
      </div>

      <!-- the dimmer, the panel's one big control -->
      <div style="position: relative; margin-top: 40px; height: 56px; border-radius: 28px; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.10); overflow: hidden;">
        <div style="position: absolute; inset: 0; width: 28%; background: linear-gradient(90deg, rgba(233,184,114,.55), #e9b872);"></div>
        <div style="position: absolute; top: 8px; left: calc(28% - 48px); width: 40px; height: 40px; border-radius: 50%; background: #f1eee8; box-shadow: 0 2px 10px rgba(0,0,0,.35);"></div>
      </div>
      <div style="margin-top: 12px; font-size: 14.5px; color: #b9b5ad;">Drag to dim. It stays here until a routine moves it.</div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
