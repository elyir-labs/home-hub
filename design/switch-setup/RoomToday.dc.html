<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Instrument Sans", -apple-system, "SF Pro Text", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      /* the panel's own tokens -- app/src/panel.css -- and the two pane inks it computes */
      --bg: #0c0d10; --surface-rgb: 26,28,34; --surface: rgba(var(--surface-rgb),.68); --surface-hi: rgba(255,255,255,.08);
      --edge: rgba(255,255,255,.1); --edge-hi: rgba(255,255,255,.18);
      --ink: #f1eee8; --ink-2: #b9b5ad; --muted: #7f7d77;
      --ink-3: oklch(0.68 0.01 242); --ink-4: oklch(0.76 0.006 242);
      --lamp-rgb: 233,184,114; --lamp: rgb(var(--lamp-rgb)); --lamp-ink: #2a1c07;
      --live-rgb: 116,198,157; --live: rgb(var(--live-rgb));
      --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
    }
    .screen { position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--bg); color: var(--ink); font-size: 17px; line-height: 1.4; }
    .abs { position: absolute; }
    .dsp { font-weight: 400; letter-spacing: -.025em; }
    svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    /* the glass the bar and the round buttons are made of (.tabs, .back, .topbar-add) */
    .glass { background-image: linear-gradient(112deg, transparent 26%, rgba(255,255,255,.11) 45%, rgba(255,255,255,.02) 56%, transparent 64%),
                               linear-gradient(148deg, oklch(0.545 0.014 242 / .34), oklch(0.475 0.012 242 / .12) 46%, oklch(0.505 0.014 242 / .24));
             box-shadow: inset 0 -46px 56px -48px rgba(22,43,68,.9), 0 23px 53px -26px rgba(17,35,60,.58), 0 2px 10px rgba(17,35,60,.37); }
    .round { position: absolute; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
    .tab { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 22px; border-radius: 999px; font-size: 15.5px; color: var(--ink-2); }
    .tab.on { background: rgba(255,255,255,.1); color: var(--ink); font-weight: 500; }
    /* a card in a room, at night: the tile's glass (.tile-body is 17 18 15) */
    .tile { position: absolute; border-radius: 24px; background: rgba(var(--surface-rgb),.62); border: 1px solid var(--edge);
            box-shadow: 0 24px 50px -32px rgba(0,0,0,.85); padding: 17px 18px 15px; overflow: hidden; }
    .tile .tn { display: flex; align-items: center; gap: 11px; font-size: 16px; font-weight: 500; letter-spacing: -.005em; }
    .tile .tn svg { color: var(--ink-2); }
    .tile .ts { position: absolute; left: 18px; right: 18px; bottom: 15px; font-size: 14.5px; color: var(--ink-2); }
    .tile.lit { background: linear-gradient(165deg, rgba(246,226,192,.94), rgba(var(--lamp-rgb),.8) 75%); border-color: rgba(255,240,214,.5); box-shadow: 0 0 40px -10px rgba(var(--lamp-rgb),.35), 0 24px 50px -32px rgba(0,0,0,.85); }
    .tile.lit .tn svg { color: var(--lamp-ink); }
    .row { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 12px; font-size: 14.5px;
           border: 1px solid var(--edge); background: rgba(255,255,255,.04); }
    .row.on { background: rgba(var(--lamp-rgb),.9); color: var(--lamp-ink); border-color: transparent; font-weight: 500; }
    .row .v { margin-left: auto; color: var(--muted); }
    .row.on .v { color: var(--lamp-ink); }
    .scene { height: 62px; border-radius: 16px; border: 1px solid var(--edge); background: rgba(255,255,255,.035); display: flex; align-items: center; gap: 14px; padding: 0 16px; }
    .scene b { display: block; font-weight: 400; font-size: 16.5px; }
    .scene small { display: block; font-size: 13px; color: var(--muted); }
    /* the room's own line of chips (.why-line, .reading) */
    .chipline { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 12px; border-radius: 999px; font-size: 13.5px;
                color: var(--ink-2); background: rgba(255,255,255,.08); border: 1px solid var(--edge); white-space: nowrap; }
    .chipline .ask { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .reading { display: inline-flex; align-items: center; gap: 8px; height: 39px; padding: 0 14px 0 11px; border-radius: 999px; font-size: 14px; color: var(--ink-2);
               background: rgba(var(--surface-rgb),.68); border: 1px solid var(--edge); white-space: nowrap; }
    .reading b { color: var(--ink); font-weight: 500; }

    .sheet2 { position: absolute; left: 0; top: 100px; width: 1440px; height: 800px; border-radius: 34px 34px 0 0; overflow: hidden;
              background: linear-gradient(rgba(26,28,34,.86), rgba(16,17,21,.96)); box-shadow: inset 0 1.4px 0 rgba(255,255,255,.4); }
    .side { position: absolute; left: 0; top: 0; width: 320px; height: 800px; border-right: 1px solid var(--edge); }
    .door { display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 12px; margin: 0 20px 8px; border-radius: 14px; }
    .door .di { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.08); display: grid; place-items: center; color: var(--ink-2); flex: none; }
    .door b { display: block; font-weight: 400; font-size: 15.5px; }
    .door small { display: block; font-size: 13px; color: var(--muted); }
    .door.on { background: rgba(255,255,255,.08); }
    .door.on .di { background: var(--ink); color: var(--bg); }
    .main { position: absolute; left: 321px; top: 0; right: 0; height: 800px; }
    .h1 { position: absolute; left: 48px; top: 26px; font-size: 44px; letter-spacing: -.03em; line-height: 52px; }
    .rule { position: absolute; left: 0; right: 0; top: 86px; border-top: 1px solid var(--edge); }
    .col { position: absolute; left: 48px; top: 108px; width: 760px; }
    .ok { display: flex; align-items: center; gap: 12px; font-size: 26px; letter-spacing: -.01em; }
    .ok i { width: 36px; height: 36px; border-radius: 10px; background: rgba(var(--live-rgb),.9); color: #0c2a1b; display: grid; place-items: center; }
    .desc { margin: 14px 0 0; font-size: 15px; line-height: 1.5; color: var(--ink-2); }
    .desc b { color: var(--ink); font-weight: 500; }
    .lab { margin: 22px 0 10px; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .cb { display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 999px; background: rgba(var(--surface-rgb),.68); border: 1px solid var(--edge); color: var(--ink-2); font-size: 15px; white-space: nowrap; }
    .cb.on { background: var(--ink); color: var(--bg); border-color: transparent; font-weight: 500; }
    .cb.s { padding: 7px 13px; font-size: 14px; }
    .field { display: flex; align-items: center; height: 52px; padding: 0 16px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid var(--edge); font-size: 17px; }
    .field small { margin-left: auto; font-size: 13px; color: var(--muted); }
    .acts { display: flex; gap: 10px; }
    .b1 { display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 16.5px; font-weight: 500; }
    .b2 { display: inline-flex; align-items: center; height: 48px; padding: 0 20px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid var(--edge); color: var(--ink); font-size: 16.5px; }
    .thing { border-radius: 22px; border: 1px solid var(--edge); background: rgba(255,255,255,.035); padding: 16px 18px; }
    .thing .top { display: flex; align-items: center; gap: 14px; }
    .ti { width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.08); display: grid; place-items: center; color: var(--ink-2); flex: none; }
    .thing b { font-weight: 500; font-size: 17px; }
    .thing small { display: block; font-size: 13.5px; color: var(--muted); margin-top: 1px; }
    .came { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .new { outline: 1.5px dashed rgba(var(--lamp-rgb),.75); outline-offset: 5px; }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 22px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); }
    .dots i.on { background: var(--ink); }
    .note { position: absolute; border: 1px dashed rgba(255,255,255,.24); border-radius: 18px; padding: 14px 16px; background: rgba(8,9,12,.86);
            font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
    .note b { color: var(--ink); font-weight: 500; }
    .note .cap { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .note p { margin: 6px 0 0; }
  </style>

  <style>
    .ask { margin-top: 26px; font-size: 30px; letter-spacing: -.02em; line-height: 1.2; }
    .big { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    .pick { display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 18px; border-radius: 18px; border: 1px solid var(--edge); background: rgba(255,255,255,.035); font-size: 17px; }
    .pick small { display: block; font-size: 13.5px; color: var(--muted); }
    .pick.on { background: var(--ink); color: var(--bg); border-color: transparent; }
    .pick.on small { color: rgba(12,13,16,.6); }
    .pick .pi { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.08); display: grid; place-items: center; color: var(--ink-2); flex: none; }
    .pick.on .pi { background: rgba(12,13,16,.12); color: var(--bg); }
    .said { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 4px; font-size: 15px; color: var(--ink-2); border-bottom: 1px solid var(--edge); }
    .said b { color: var(--ink); font-weight: 500; }
    .said .ch { margin-left: auto; font-size: 14px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
    .said .tick { width: 22px; height: 22px; border-radius: 7px; background: rgba(var(--live-rgb),.9); color: #0c2a1b; display: grid; place-items: center; flex: none; }
    .later { display: flex; align-items: center; gap: 12px; height: 34px; font-size: 14.5px; color: var(--muted); }
    .later i { width: 22px; height: 22px; border-radius: 7px; border: 1px dashed rgba(255,255,255,.22); flex: none; }
    .seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--edge); }
    .seg span { padding: 8px 15px; border-radius: 999px; font-size: 14.5px; color: var(--ink-2); white-space: nowrap; }
    .seg span.on { background: var(--ink); color: var(--bg); font-weight: 500; }
    .set { display: grid; grid-template-columns: 210px 1fr; align-items: center; justify-items: start; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--edge); }
    .set .k { font-size: 15px; color: var(--ink); }
    .set .k small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
    .live { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; border-radius: 999px; background: rgba(var(--lamp-rgb),.14); color: var(--lamp); font-size: 15px; border: 1px solid rgba(var(--lamp-rgb),.35); }
    .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 0 5px rgba(var(--lamp-rgb),.22); }
    .tab-pic { position: absolute; border-radius: 26px; border: 1px solid var(--edge); background: rgba(255,255,255,.03); }
    .restart { display: flex; gap: 16px; align-items: center; margin-top: 18px; padding: 12px 18px; border-radius: 18px; background: rgba(var(--lamp-rgb),.08); border: 1px solid rgba(var(--lamp-rgb),.3); }
    .restart b { font-weight: 500; }
    .restart small { display: block; font-size: 14px; color: var(--ink-2); margin-top: 3px; line-height: 1.45; }
  </style>
</helmet>

<!-- TODAY: the house's rooms and nothing else. A room that isn't on the house yet has to be made somewhere else first. -->
<div class="screen">
  <img src="shots/room-today.jpg" alt="" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; display: block;">
</div>
</x-dc>
</body>
</html>
