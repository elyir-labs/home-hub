<!doctype html>
<html>
<head><meta charset="utf-8"><title>A: move the cable</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="first.css">
<link rel="stylesheet" href="modem.css">
</head>
<body>
<div class="glass">
  <div class="say ready" style="top: 220px">Plug the hub into your router</div>
  <svg class="cables" viewBox="0 0 1440 900"><g transform="translate(300 0)">
    <rect class="box" x="0" y="380" width="240" height="120" rx="18"/><text class="name" x="120" y="436">Modem</text><text class="sub" x="120" y="462">from your internet company</text>
    <rect class="box" x="320" y="380" width="240" height="120" rx="18"/><text class="name" x="440" y="436">Router</text><text class="sub" x="440" y="462">your Wi‑Fi</text>
    <path class="wire" d="M240 440H320"/>
    <path class="here" d="M560 440H670"/>
    <path class="now" d="M120 500C120 600 755 600 755 505"/>
    <text class="tag" x="437" y="612" fill="#8f8b84">Plugged in here now</text>
    <text class="tag" x="615" y="420" fill="rgb(233,184,114)">Here</text>
  </g></svg>
  <div class="house" style="left: 980px; top: 365px; width: 150px; height: 150px" data-lamp=".35"></div>
  <div class="say line" style="top: 673px">It’s plugged into your modem, so phones at home can’t find it</div>
  <div class="say quiet" style="top: 721px">Move its cable to a spare port on your router. A code to scan appears here once it’s moved.</div>
</div>
<script src="first.js"></script>
</body>
</html>
