<!doctype html>
<html>
<head><meta charset="utf-8"><title>C: either way, side by side</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="first.css">
<link rel="stylesheet" href="modem.css">
</head>
<body>
<div class="glass">
  <div class="house small" data-lamp="1"></div>
  <div class="say ready" style="top: 275px">Your hub is ready, two ways in</div>
  <div class="tile" style="left: 330px; top: 360px; width: 240px; height: 240px; padding: 19px"><img src="qr-wifi.svg" alt=""></div>
  <div class="col" style="left: 220px; top: 628px; width: 460px"><div class="big">Scan to set it up over Wi‑Fi</div><div class="small">Or join <b>Elyir Hub 4F2A</b>, password <b>kite-maple-41</b></div></div>
  <div class="rule" style="top: 380px; height: 120px"></div><div class="or" style="top: 520px">or</div><div class="rule" style="top: 560px; height: 160px"></div>
  <svg class="cables" viewBox="0 0 1440 900"><g transform="translate(800 -10) scale(.92)">
    <rect class="box" x="0" y="420" width="170" height="100" rx="16"/><text class="name" x="85" y="477">Modem</text>
    <rect class="box" x="300" y="420" width="170" height="100" rx="16"/><text class="name" x="385" y="477">Router</text>
    <path class="wire" d="M170 470H300"/>
    <path class="here" d="M385 520V600"/>
    <path class="now" d="M85 520C85 610 300 640 360 625"/>
    <text class="tag" x="420" y="580" fill="rgb(233,184,114)">Here</text>
  </g></svg>
  <div class="house" style="left: 1105px; top: 545px; width: 80px; height: 80px" data-lamp=".35"></div>
  <div class="col" style="left: 760px; top: 628px; width: 460px"><div class="big">Or move its cable to your router</div><div class="small">It’s in your modem now, which phones at home can’t reach. A new code appears here once it’s moved.</div></div>
</div>
<script src="first.js"></script>
</body>
</html>
