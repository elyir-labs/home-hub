# Temporary driver layer on the Mac while the Pi ships. No radios, no host networking
# (Docker Desktop on macOS cannot do mDNS discovery). Devices are added by IP.
# The ./homeassistant config dir moves to the Pi unchanged.
#   docker compose -f docker-compose.mac.yml up -d

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.1
    container_name: homeassistant
    restart: unless-stopped
    depends_on: [mosquitto]
    ports:
      - "8123:8123"
    volumes:
      - ./homeassistant:/config
    environment:
      - TZ=${TZ:-America/New_York}

  caddy:
    # HTTPS in front of the brain: https://<this mac>:8443. See caddy/Caddyfile for the trust step.
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "8088:8088"
      - "127.0.0.1:9443:9443"   # the away door, reachable from this mac and not from the network
    environment:
      - HUB_HTTP=http://localhost:8088, http://${HUB_IP:-192.168.1.59}:8088
      - HUB_HOSTS=https://localhost:8443, https://${HUB_IP:-192.168.1.59}:8443
      - HUB_RELAY_BIND=0.0.0.0   # inside the container; the published port above is what keeps it local
      - BRAIN_UPSTREAM=host.docker.internal:8300
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The away door is one of two files the Caddyfile imports, and an import Caddy cannot find stops it
      # starting at all -- the whole front door, not only the away one. Found 2 October 2026 on a real hub.
      - ./caddy/away:/etc/caddy/away:ro
      - ./lan-cert/data:/lan:ro
      - ./caddy/data:/data

  ring-mqtt:
    # Ring Alarm and everything paired to its base station (Z-Wave locks, switches, plugs, contact and
    # motion sensors) via Ring's cloud, published to Mosquitto with HA discovery. First run: open
    # http://<host>:55123, sign in to Ring (with 2FA); the token is kept in ./ring-mqtt after that.
    image: tsightler/ring-mqtt:5.9.3
    container_name: ring-mqtt
    restart: unless-stopped
    depends_on: [mosquitto]
    ports:
      - "55123:55123"
    environment:
      # ring-mqtt reads only ./ring-mqtt/config.json here too: mqtt-auth.sh renders it with the password.
      - ENABLEMODES=true
    volumes:
      - ./ring-mqtt:/data
