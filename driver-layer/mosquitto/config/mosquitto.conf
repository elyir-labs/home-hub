# Messages: the broker the radios, Ring and the engine talk through. It takes a password, always.
# mqtt-auth.sh writes the password file from MQTT_USER / MQTT_PASSWORD in .env (install.sh runs it;
# on a Mac, run it once by hand). Anyone on the Wi-Fi can reach :1883 -- a bridge on the network,
# such as puck, needs to -- so anonymous is off: an open broker would let a guest's
# laptop unlock a Zigbee lock or open pairing, with nothing on the panel to say so.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
# To the container's output, where the host's log cap applies (host/harden.sh), not to a file that only grows.
log_dest stdout
