# The house's end of the tunnel: one connection out to the relay, held open, and every phone away
# carried back down it to the away door on loopback. docs/away.md, piece 2.
#
# Nothing here is specific to a house; the values come from .env through frp's own templating, so
# this file is the same in every house and install.sh never writes it.
#
# NOT here, deliberately: any `plugin` line. frp ships an `https2http` plugin that terminates TLS, and
# the relay carrying bytes it cannot read is a property of not using one. The proxy below hands the
# raw handshake to Caddy, which is where the house's only key is.

serverAddr = "{{ .Envs.HUB_RELAY_ADDR }}"
serverPort = 443
loginFailExit = false

auth.method = "token"
auth.token = "{{ .Envs.HUB_RELAY_TOKEN }}"

# Who this house is, to the relay. frps hands both to the registration service before it carries
# anything (relay/service/registry.py, judge): the secret proves the name, and `user` must be the same
# name because frps prefixes every proxy with it, which keeps one house's proxies apart from the next.
# A relay of your own without that service ignores all three.
user = "{{ .Envs.HUB_AWAY_HOUSE }}"
metadatas.house = "{{ .Envs.HUB_AWAY_HOUSE }}"
metadatas.secret = "{{ .Envs.HUB_RELAY_SECRET }}"

# The relay takes houses dialing in and phones arriving on the same port, 443, the one that survives a
# hotel. This first byte is how it tells the two apart; without it the tunnel never comes up.
transport.tls.disableCustomTLSFirstByte = false

log.to = "console"
log.level = "info"

[[proxies]]
# frps names it <house>.away, from `user` above, so every house can call its one proxy the same thing.
name = "away"
type = "https"
customDomains = ["{{ .Envs.HUB_AWAY_NAME }}"]
localIP = "127.0.0.1"
localPort = 9443
# Who is really asking. Without it every phone away arrives from 127.0.0.1 and shares one bucket of
# wrong codes; the away door reads this header and only from loopback (caddy/Caddyfile).
transport.proxyProtocolVersion = "v2"
