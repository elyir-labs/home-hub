; The bridge puck: the hub's own small device on a socket (src/main.cpp).
;
;     pio run -e esp32s3-ship               the image the hub flashes onto a bare board
;     pio run -e esp32s3-ship -t upload     the same, onto a board on this machine's USB
;
; Any board here needs BLE + Wi-Fi; ESP32-S2 is absent because it has no Bluetooth radio at all.
;
; A module (src/module.h) adds builds of its own from private/*.ini, where private/ is a link to the
; module's folder and is never committed. Without one, this is the whole puck.

[platformio]
default_envs = esp32s3-ship
extra_configs = private/*.ini

[env]
framework = arduino
monitor_speed = 115200
; BLE + WiFi + MQTT overflows the default partition table on every target -- and huge_app.csv, which
; used to be here, has ONE app slot, so an image built with it can never be updated over the air: OTA
; writes the other slot and flips otadata, and there is no other slot. min_spiffs.csv is the stock
; table with two 1.9 MB slots, which the ~1 MB image fits inside with room. The 16 MB S3 boards
; override it below with something roomier. See docs/puck-updates.md.
board_build.partitions = min_spiffs.csv
; THE LONG-WRITE POOL, FOR EVERY PUCK. A strip's handshake is a ~400-byte write over an MTU of 69 --
; a prepare-write chain out of msys_1 -- and while an errand holds a second link a module's traffic
; can queue in the same pool (docs/strip.md items 39 and 40). At NimBLE's stock 12 the fifth exchange
; of an adoption failed with rc=6.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=40
build_unflags = -std=gnu++11
lib_deps =
    knolleary/PubSubClient@^2.8
    ; NimBLE, not the Bluedroid-based BLE library that ships with the core: its writes and connects
    ; have timeouts, so a device dropping the link mid-write cannot hang the main loop (which is what
    ; killed the MQTT session on weak links).
    h2zero/NimBLE-Arduino@^1.4.3

; ---- what the hub ships ---------------------------------------------------------
; NO secrets header: it comes up blank and is written to over the cable (src/config.h). This is the
; image the hub flashes onto a bare board. The header name points at a file that does not exist on
; purpose -- a desk build's include/secrets*.h may be on this machine, and this build must not see it.
[env:esp32s3-ship]
platform = espressif32 @ 6.11.0
board = esp32-s3-devkitc-1
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.partitions = partitions-ota.csv
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DSECRETS_FILE='"no-secrets-in-a-shipped-image.h"'
