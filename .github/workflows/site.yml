# The site at https://hub.elyir.com (the front page, /install, the waitlist and the pretend house at /try), deployed when something it's made of
# changes on main. It is design/site's D; site/site.test.mjs pins it to the board and is run before anything goes up.
#
# Secrets, both written by site/terraform/ (deploy.tf), never by hand:
#   CLOUDFLARE_API_TOKEN   the account's token that can only upload Pages (not the site's Terraform token)
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account
# A fork without them builds, tests and skips the deploy. Here, without them, the run fails: a green run that uploaded
# nothing kept the old page up for ten days after the move to elyir-labs. The project, the address and the waitlist's
# database are made by site/terraform/ too.
name: Site (hub.elyir.com)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"                # https://hub.elyir.com/install serves it
      - "app/**"                    # the pretend house at /try is the panel, built from here
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The page still matches its board
        run: node --test site/site.test.mjs

      - name: The pretend house
        working-directory: app
        run: npm ci && npm run build:try

      - name: Put it together
        run: site/build.sh

      - name: The deploy has what it needs
        if: github.repository == 'elyir-labs/home-hub' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: |
          echo "::error::No CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID: nothing would go up. Apply site/terraform/ (deploy.tf)."
          exit 1

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: site
        run: npx --yes wrangler@4 pages deploy dist --project-name elyir-home-hub --branch main --commit-dirty=true
