# The brain, with the panel built in, as one image for both kinds of hub host: amd64 (a NUC, any
# Linux box, a VM) and arm64 (Pi 5). install.sh pulls it and only builds locally when the pull fails.
#
# What each tag means, because a hub chooses between them:
#   latest, X.Y.Z, X.Y   a release. Only a version tag produces these, and only after ci.yml has
#                        passed against that commit. This is what a hub in someone's house runs.
#   main, development,   whatever that branch is at. For a hub being worked on (HUB_CHANNEL=main or
#   sha-<sha>            development) and for looking at a build before tagging it. Never what a
#                        family gets.
name: brain image

on:
  push:
    branches: [main, development]
    tags: ["v*"]
    # Every file a hub runs, not only the ones inside the image: a branch hub is offered the newest
    # commit that built here (brain/hub/updates.py), so a change to the host scripts or the compose
    # file that built nothing was offered forever and installed by no tap. The rebuild is all cache.
    paths: ["brain/**", "app/**", "sounds/**", "driver-layer/**", "install.sh", ".github/workflows/brain-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write      # cosign signs with the workflow's own OIDC identity; there is no key to keep

jobs:
  # Tags bypass branch protection, so a release is verified here before it is published. Pushes to
  # main skip this: they arrived through a protected branch and were verified on the way in. Pushes
  # to development skip it too, for a different reason: ci.yml checks the same commit through the
  # pull request development always has open to main, and the only hub that follows it is the one on
  # the desk of whoever pushed.
  verify:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    # `always()` so a push to a branch, where verify is skipped rather than run, still builds.
    if: always() && needs.verify.result != 'failure' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/home-hub-brain
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: brain/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HUB_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('{0}-{1}', github.ref_name, github.sha) }}
            HUB_COMMIT=${{ github.sha }}
          # Its own scope. An unscoped type=gha uses the default key `buildkit` for every
          # build in the repository, so these two publishing workflows and the two proof
          # builds in ci.yml were all overwriting one cache.
          cache-from: type=gha,scope=brain-publish
          cache-to: type=gha,mode=max,scope=brain-publish

      # Keyless: the signature binds "built by this workflow, in this repository, from this commit",
      # with no key for anybody to lose or steal. It is not what a hub checks -- a hub checks the
      # maker's own signature over the release manifest, because this one would sign an attacker's
      # commit just as happily if they could push. tools/release.sh checks this before signing that,
      # so the maker's signature is only ever given to an image this workflow actually built.
      # docs/updates.md, piece 2.
      - uses: sigstore/cosign-installer@v3
        if: github.ref_type == 'tag'
      - name: sign the image
        if: github.ref_type == 'tag'
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/home-hub-brain@${{ steps.build.outputs.digest }}"
