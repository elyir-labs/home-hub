# The flash-and-go image: Raspberry Pi OS Lite (64-bit) with the hub already on it. Built with pi-gen
# on every version tag (and by hand from the Actions tab), attached to the GitHub release as a .img.xz
# with its checksum. See driver-layer/host/pi-image/README.md.
name: pi image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag is not a branch: branch protection does not apply to one, so nothing otherwise stops a
  # release being cut from a commit that never passed a test. This is what stops it.
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    needs: verify
    # A native arm64 runner (free for public repositories): pi-gen builds the 64-bit image without emulation, several
    # times faster, and sidesteps the binfmt trouble that stops Trixie builds on x86 runners (usimd/pi-gen-action#179).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Which code the image carries
        run: |
          mkdir -p driver-layer/host/pi-image/stage-hub/00-home-hub/files
          printf 'HOME_HUB_REF=%s\nHOME_HUB_REPO=https://github.com/%s.git\n' "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" \
            > driver-layer/host/pi-image/stage-hub/00-home-hub/files/home-hub.conf
          # Built from a branch by hand, not a tag: the hub follows that branch (install.sh, HOME_HUB_BRANCH).
          case "$GITHUB_REF_NAME" in v[0-9]*) ;; *) echo "HOME_HUB_BRANCH=${GITHUB_REF_NAME}" >> driver-layer/host/pi-image/stage-hub/00-home-hub/files/home-hub.conf ;; esac
          cat driver-layer/host/pi-image/stage-hub/00-home-hub/files/home-hub.conf
      - name: Room on the runner
        # The action's own "increase-runner-disk-size" purges packages with apt and fails on today's runner image
        # (exit 100). Deleting the big toolchains nobody needs here frees space without apt; missing paths are fine.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - name: The containers a hub starts with before it has internet
        # The brain and the front door serve the Wi-Fi step on a box with no cable (docs/network.md, piece 5),
        # and the broker's image is what install.sh hashes its password with. Saved under the names compose
        # will ask for on this version; firstboot.sh loads them. The brain is published by brain-image.yml from
        # the same tag, so it may not be there yet.
        run: |
          F=driver-layer/host/pi-image/stage-hub/00-home-hub/files/preload; mkdir -p "$F"
          # As the x86 image does: a release pulls its published brain, a branch builds its own here (natively: this runner is arm64).
          case "$GITHUB_REF_NAME" in
            v*) B="ghcr.io/elyir-labs/home-hub-brain:${GITHUB_REF_NAME#v}"
                for i in $(seq 1 60); do docker pull -q --platform linux/arm64 "$B" && break; echo "waiting for $B"; sleep 30; done ;;
            *)  B="ghcr.io/elyir-labs/home-hub-brain:$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
                docker build -q -f brain/Dockerfile --build-arg HUB_VERSION="$GITHUB_REF_NAME-$GITHUB_SHA" --build-arg HUB_COMMIT="$GITHUB_SHA" -t "$B" . ;;
          esac
          docker pull -q --platform linux/arm64 caddy:2
          docker pull -q --platform linux/arm64 eclipse-mosquitto:2
          docker save "$B" -o "$F/brain.tar"; docker save caddy:2 -o "$F/caddy.tar"; docker save eclipse-mosquitto:2 -o "$F/mosquitto.tar"
          ls -lh "$F"
      - name: A password nobody keeps
        # pi-gen turns off Raspberry Pi OS's first-boot "enter new username" prompt only for an image built with a
        # password. On a hub with a screen, that prompt took the screen and held the boot until someone answered it.
        # This one is never written down, and the stage locks the account before the image is made (00-run.sh).
        id: pass
        run: |
          P=$(openssl rand -hex 24); echo "::add-mask::$P"; echo "value=$P" >> "$GITHUB_OUTPUT"
      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: home-hub-${{ github.ref_name }}
          stage-list: stage0 stage1 stage2 ./driver-layer/host/pi-image/stage-hub
          hostname: hub
          username: hub
          password: ${{ steps.pass.outputs.value }}
          disable-first-boot-user-rename: 1
          enable-ssh: 0
          locale: en_US.UTF-8
          keyboard-layout: English (US)
          keyboard-keymap: us
          timezone: America/Chicago   # only until first boot: install.sh reads the Pi's own zone; must be an Area/City name for the action
          compression: xz
          compression-level: 6
          pi-gen-version: arm64
          release: trixie
          increase-runner-disk-size: false
          verbose-output: true
      - name: Checksum
        run: |
          IMG="${{ steps.build.outputs.image-path }}"
          (cd "$(dirname "$IMG")" && sha256sum "$(basename "$IMG")" | tee "$(basename "$IMG").sha256")
          ls -lh "$(dirname "$IMG")"
      - uses: actions/upload-artifact@v4
        with:
          name: home-hub-image
          path: ${{ steps.build.outputs.image-path }}*
          retention-days: 14
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ steps.build.outputs.image-path }}*
          generate_release_notes: true
